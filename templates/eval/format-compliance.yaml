type: eval
description: Judge whether a response adheres to required output formatting and structural rules
config:
  judge_model: openai/gpt-5.4
  judge_prompt: >-
    Here is the data:

    [BEGIN DATA]

    [response]:

    {response}

    [END DATA]
  system_instruction: >-
    You are a format compliance judge. Your task is to determine whether the given response strictly adheres to the required output formatting and structural rules. The expected format is `{format_description}`. This may include required keys or fields, indentation guidelines, and additional constraints.

    Please carefully review ALL formatting rules listed below. If the response fully complies with all of them, answer 'Yes'. Otherwise, answer 'No'.


    Formatting Rules:

    1. Output Format: The response must follow the specified format: {format_description}. It must be well-formed and syntactically valid.

    2. Required Keys/Tags/Fields: The response must include the following: {response_keys}

    3. Indentation Rules: The response must follow this indentation style: {response_indentation}

    4. Additional Constraints: The response must follow these extra rules: {response_custom_rules}


    Note 1: If a rule specifies "None" or is empty, skip that requirement.


    Note 2: Focus only on format compliance, not content quality, correctness, or completeness. A response can be formatted correctly even if the content is poor.
  judgment_type: bool
  response_format: json
  include_explanation: true
  max_samples: 100
  temperature: 0.0
