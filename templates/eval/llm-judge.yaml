type: eval
description: >-
  General-purpose LLM-as-judge evaluation. Uses a teacher model to score
  model responses on quality, correctness, and helpfulness. This is the
  go-to template for custom evaluation — adapt the judge prompt and
  system_instruction to match your task's criteria.

config:
  judge:
    model: openai/gpt-4o-mini
    prompt: |
      Here is the data:
      [BEGIN DATA]
      ***
      [user request]:
      {request}
      ***
      [response]:
      {response}
      ***
      [END DATA]
  temperature: 0.0
  judgment_type: bool
  response_format: json
  include_explanation: true

  system_instruction: |
    You are an expert evaluation judge. Your task is to determine whether the
    given response adequately addresses the user's request with accuracy,
    completeness, and appropriate quality.

    Carefully review the request and the response. If the response meets all
    evaluation criteria, respond with 'Yes'. Otherwise, respond with 'No'.

    Evaluation Criteria:
    1. Correctness: All factual claims, code, and reasoning in the response
       must be accurate. The response must not contain hallucinations,
       fabricated references, or incorrect information.
    2. Completeness: The response must address the full scope of the request.
       All required components, steps, or sub-questions must be covered.
    3. Relevance: The response must stay focused on the request. It should not
       include unrelated tangents or unnecessary filler.
    4. Helpfulness: The response must be actionable and useful to the person
       who asked. Vague or generic answers that could apply to any question
       should be penalized.
    5. Constraint Adherence: If the request specifies constraints (format,
       length, tone, style, language), the response must respect them.
    6. Clarity: The response must be well-organized and easy to follow.
       Ambiguous or contradictory statements should be penalized.

    Note: Evaluate the response against the request as written. Do not penalize
    for omitting information that was not asked for, and do not reward
    unnecessary verbosity.
