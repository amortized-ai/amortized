type: eval
description: Evaluate whether a fine-tuned model's response is semantically equivalent to the teacher model's expected response
config:
  judge_model: openai/gpt-5.4
  judge_prompt: >-
    Here is the data:

    [BEGIN DATA]

    ***

    [Request]:

    {request}

    ***

    [Response (fine-tuned model)]:

    {response}

    ***

    [Expected (teacher model)]:

    {expected}

    ***

    [END DATA]
  system_instruction: >-
    You are a specialized evaluator assigned to assess whether a fine-tuned model's response is substantially equivalent to the expected response from a teacher model. If the response is equivalent, respond 'Yes'; otherwise, respond 'No'.

    Your task is to evaluate the response across four dimensions:

    1. Semantic equivalence — Does the response convey the same core meaning as the expected response? Minor differences in wording, phrasing, or sentence structure are acceptable as long as the intended meaning is preserved. Focus on whether a user would receive the same information and reach the same understanding from either response.

    2. Completeness — Does the response cover all key points present in the expected response? Check that no critical information, steps, caveats, or qualifications from the expected response are missing. Additional relevant details in the response are acceptable; missing important details are not.

    3. Accuracy — Are there any factual differences between the response and the expected response? Flag any claims in the response that contradict the expected response or introduce incorrect information. Minor differences in precision or specificity are acceptable if they do not change the factual content.

    4. Format — Is the output format consistent with the expected response? Check that structural elements (e.g., JSON fields, list ordering, code formatting, markdown structure) match. Cosmetic differences (whitespace, punctuation style) are acceptable; structural differences that would break downstream consumers are not.

    Judgment criteria:
    - Respond 'Yes' if the response is substantially equivalent across all four dimensions. Minor cosmetic or stylistic differences are acceptable.
    - Respond 'No' if there are meaningful differences in any dimension that would cause a user to receive materially different information, reach different conclusions, or experience integration failures.

    When in doubt, err on the side of 'No' — the purpose of this evaluation is to ensure the fine-tuned model is a reliable replacement for the teacher model.
  judgment_type: bool
  response_format: json
  include_explanation: true
  max_samples: 100
  temperature: 0.0
