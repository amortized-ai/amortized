type: training
description: GKD — generalized knowledge distillation via TRL (experimental)
config:
  algorithm: gkd

  # Training
  max_steps: 500
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  lr_scheduler_type: cosine
  warmup_steps: 50
  weight_decay: 0.01
  max_grad_norm: 1.0

  # GKD params
  temperature: 0.9
  lmbda: 0.5
  beta: 0.5
  max_new_tokens: 512
  disable_dropout: true

  # Precision
  bf16: true

  # Logging
  logging_steps: 10
  save_steps: 100
  report_to: none

compute:
  gpus: 1
  min_vram_gb: 24
