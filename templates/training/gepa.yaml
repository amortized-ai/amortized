type: training
description: GEPA — guided evolution of prompt adaptations via training-hub
config:
  algorithm: gepa

  # Training
  max_steps: 500
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-04
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Precision
  bf16: true

  # Memory
  gradient_checkpointing: true

  # Logging
  logging_steps: 10
  save_steps: 100
  report_to: none

compute:
  gpus: 1
  min_vram_gb: 24
