type: training
description: QLoRA SFT — 4-bit quantized LoRA for minimal VRAM
config:
  algorithm: lora_sft
  load_in_4bit: true

  # Data
  max_length: 2048

  # Training
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-04
  lr_scheduler_type: cosine
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Precision
  bf16: true

  # LoRA
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

  # Memory
  gradient_checkpointing: true

  # Logging
  logging_steps: 10
  save_steps: 500
  report_to: none

compute:
  gpus: 1
  min_vram_gb: 10
