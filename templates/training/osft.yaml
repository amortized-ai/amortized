type: training
description: On-policy SFT — online supervised fine-tuning via training-hub
config:
  algorithm: osft

  # Data
  max_length: 4096

  # Training
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-05
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Precision
  bf16: true

  # Memory
  gradient_checkpointing: true

  # Logging
  logging_steps: 10
  save_steps: 500
  report_to: none

compute:
  gpus: 1
  min_vram_gb: 40
