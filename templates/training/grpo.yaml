type: training
description: GRPO — group relative policy optimization via TRL
config:
  algorithm: grpo

  # Data
  max_prompt_length: 512
  max_completion_length: 256

  # Training
  max_steps: 500
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-06
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0

  # GRPO params
  num_generations: 8
  temperature: 0.9
  beta: 0.0
  epsilon: 0.2

  # Precision
  bf16: true

  # LoRA (GRPO typically uses LoRA to save VRAM for generation)
  use_peft: true
  lora_r: 16
  lora_alpha: 8
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

  # Memory
  gradient_checkpointing: true

  # Logging
  logging_steps: 10
  save_steps: 100
  report_to: none

compute:
  gpus: 1
  min_vram_gb: 24
