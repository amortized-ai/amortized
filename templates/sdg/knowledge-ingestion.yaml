type: sdg
description: Knowledge ingestion — generate QA training data from documents.

config:
  num_records: 100

  model_configs:
    - alias: text
      model: gpt-4o-mini
      provider: gateway
      skip_health_check: true
      inference_parameters:
        temperature: 0.7
        max_parallel_requests: 32

  columns:
    - column_type: sampler
      name: difficulty
      sampler_type: category
      params:
        values:
          - "Basic - Simple factual question, single concept"
          - "Intermediate - Requires connecting multiple concepts or steps"
          - "Advanced - Multi-step reasoning, edge cases, comparing approaches"
        weights: [0.35, 0.45, 0.20]

    - column_type: sampler
      name: question_type
      sampler_type: category
      params:
        values:
          - "Factual - Understanding what something is, why it works, or how components relate"
          - "Procedural - Step-by-step question about accomplishing a specific task"
          - "Troubleshooting - Diagnosing and resolving a specific error or unexpected behavior"
          - "Comparison - Choosing between options, understanding trade-offs, or comparing configurations"
        weights: [0.25, 0.35, 0.25, 0.15]

    - column_type: llm-text
      name: question
      model_alias: text
      system_prompt: >
        You generate specific, realistic questions about [DOMAIN] documentation.
        The question MUST be fully answerable using ONLY the provided
        documentation context. Do not ask about concepts that are merely
        mentioned but not explained in the context.
        Output ONLY the question text, nothing else.
      prompt: >
        Documentation context:
        {{ content }}

        Difficulty: {{ difficulty }}
        Question type: {{ question_type }}

    - column_type: llm-text
      name: answer
      model_alias: text
      system_prompt: >
        You are a knowledgeable documentation assistant for [DOMAIN].
        Answer ONLY using information from the provided documentation
        context. Do not add commands, procedures, or details that are
        not explicitly present in the context. Be concise but thorough.
        The question is answerable from the provided context, so read
        it carefully and answer from it.
      prompt: >
        Documentation context:
        {{ content }}

        Question: {{ question }}

  processors:
    - processor_type: schema_transform
      name: sft_format
      template:
        messages:
          - role: system
            content: >
              You are a knowledgeable documentation assistant for [DOMAIN].
              Answer accurately based on the official documentation. Be concise
              and provide step-by-step instructions when appropriate.
          - role: user
            content: "{{ question }}"
          - role: assistant
            content: "{{ answer }}"
