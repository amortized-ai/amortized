type: sdg
description: Knowledge ingestion — generate QA training data from documents.

config:
  # Set num_records >= estimated chunk count. Each chunk needs at least one QA pair.
  num_records: 100

  # Token-based chunking using cl100k_base (GPT tokenizer).
  # 2048 tokens per chunk with 256-token overlap prevents boundary issues.
  # The worker splits documents into chunk files before DD sees them.
  seed_config:
    source:
      chunk_size: 2048
      chunk_overlap: 256
      tokenizer: cl100k_base

  model_configs:
    - alias: text
      model: gpt-4o-mini
      provider: openai
      inference_parameters:
        temperature: 0.7
        max_parallel_requests: 32

  columns:
    - column_type: sampler
      name: difficulty
      sampler_type: category
      params:
        values: [Basic, Intermediate, Advanced]
        weights: [0.35, 0.45, 0.20]

    - column_type: sampler
      name: question_type
      sampler_type: category
      params:
        values: [Factual, Procedural, Troubleshooting, Comparison]
        weights: [0.25, 0.35, 0.25, 0.15]

    # Topics must be section-level descriptions from the document, not abstract
    # categories. Use get_document_sections to derive them. Weight by content
    # density — longer sections get higher weights. Weights must sum to 1.0.
    # Minimum weight per topic: 0.05 (even small sections need coverage).
    # Example (MaaS doc): "Tier Management - Creating, editing, deleting tiers
    #   via dashboard, configuring token rate limits and request rate limits"
    # Bad: "access control"
    - column_type: sampler
      name: topic
      sampler_type: category
      params:
        values:
          - "[Section heading - key concepts covered in this section]"
          - "[Section heading - key concepts covered in this section]"
          - "[Section heading - key concepts covered in this section]"
        weights: [0.34, 0.33, 0.33]

    # The answerability constraint ("MUST be fully answerable using ONLY the
    # provided context") reduced unanswerable questions from 21% to 0%.
    # Place each variable on its own line — inline embedding reduces salience.
    # {{ content }} is one chunk (~2048 tokens), not the full document.
    - column_type: llm-text
      name: question
      model_alias: text
      system_prompt: >
        You generate specific, realistic questions about [DOMAIN] documentation.
        The question MUST be fully answerable using ONLY the provided
        documentation context. Do not ask about concepts that are merely
        mentioned but not explained in the context.
        Output ONLY the question text, nothing else.
      prompt: >
        Documentation context:
        {{ content }}

        Topic: {{ topic }}
        Difficulty: {{ difficulty }}
        Question type: {{ question_type }}

    # "answerable from the provided context" prevents disclaimer answers.
    # Do NOT include "If the documentation does not cover the topic, say so."
    - column_type: llm-text
      name: answer
      model_alias: text
      system_prompt: >
        You are a knowledgeable documentation assistant for [DOMAIN].
        Answer accurately based on the documentation context provided.
        Include specific commands, YAML snippets, and step-by-step
        instructions when relevant. Be concise but thorough.
        The question is answerable from the provided context, so read it
        carefully and answer from it.
      prompt: >
        Documentation context:
        {{ content }}

        Question: {{ question }}

  processors:
    # This system prompt defines the trained model's behavior at inference.
    # It must match what the deployment will use.
    - processor_type: schema_transform
      name: sft_format
      template:
        messages:
          - role: system
            content: >
              You are a knowledgeable documentation assistant for [DOMAIN].
              Answer accurately based on the official documentation. Be concise
              and provide step-by-step instructions when appropriate.
          - role: user
            content: "{{ question }}"
          - role: assistant
            content: "{{ answer }}"
