<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <linearGradient id="cc-drop" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="cc-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Icon: mini distillation drop -->
  <g transform="translate(48, 58)">
    <!-- Facets -->
    <polygon points="-24,-44 0,-52 24,-44 18,-30 -18,-30" fill="url(#cc-facet)" opacity="0.8"/>
    <polygon points="-18,-30 18,-30 12,-18 -12,-18" fill="#475569" opacity="0.5"/>
    <!-- Drop -->
    <path d="M 0 -10 C -4 4, -20 22, -20 34 C -20 46, -11 54, 0 54 C 11 54, 20 46, 20 34 C 20 22, 4 4, 0 -10 Z"
          fill="url(#cc-drop)"/>
    <path d="M -4 12 C -4 12, -10 24, -10 34 C -10 40, -6 44, -2 44"
          stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>
  <!-- Wordmark -->
  <text x="110" y="72" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5" fill="#1E293B">amortized</text>
  <text x="112" y="96" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="4" fill="#64748b">TASK MODELS, FASTER</text>
</svg>