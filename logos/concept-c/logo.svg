<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="drop-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="drop-glow" cx="40%" cy="35%">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="facet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Concept C: Distillation Drop — concentrated drop emerging from geometric facets -->
  <g transform="translate(256, 240)">
    <!-- Geometric facets (frontier model knowledge) -->
    <polygon points="-100,-180 0,-210 100,-180 80,-130 -80,-130" fill="url(#facet-grad)" opacity="0.8"/>
    <polygon points="-80,-130 80,-130 60,-85 -60,-85" fill="#334155" opacity="0.6"/>
    <polygon points="-60,-85 60,-85 40,-50 -40,-50" fill="#475569" opacity="0.4"/>
    <!-- Separation line -->
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#0D9488" stroke-width="2" opacity="0.5"/>
    <!-- The distilled drop -->
    <path d="M 0 -20 C -8 10, -48 60, -48 100 C -48 132, -26 158, 0 158 C 26 158, 48 132, 48 100 C 48 60, 8 10, 0 -20 Z"
          fill="url(#drop-grad)"/>
    <!-- Drop highlight/sheen -->
    <path d="M -8 40 C -8 40, -24 70, -24 100 C -24 115, -14 125, -4 125"
          stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3"/>
    <!-- Glow beneath drop -->
    <ellipse cx="0" cy="168" rx="35" ry="8" fill="#0D9488" opacity="0.2"/>
  </g>
</svg>