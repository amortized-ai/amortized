<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="layer-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="layer-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="layer-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="layer-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>
  <!-- Concept D: Stacked Layers — pipeline stages compressing top to bottom -->
  <g transform="translate(256, 256)">
    <!-- Layer 1: SDG (widest, warmest) -->
    <rect x="-160" y="-140" width="320" height="48" rx="10" fill="url(#layer-1)"/>
    <text x="-140" y="-110" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" font-weight="600" fill="white" opacity="0.7">GENERATE</text>

    <!-- Layer 2: Train -->
    <rect x="-130" y="-72" width="260" height="48" rx="10" fill="url(#layer-2)"/>
    <text x="-110" y="-42" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" font-weight="600" fill="white" opacity="0.7">TRAIN</text>

    <!-- Layer 3: Eval -->
    <rect x="-100" y="-4" width="200" height="48" rx="10" fill="url(#layer-3)"/>
    <text x="-80" y="26" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" font-weight="600" fill="white" opacity="0.7">EVAL</text>

    <!-- Layer 4: Serve (narrowest, deepest teal) -->
    <rect x="-70" y="64" width="140" height="48" rx="10" fill="url(#layer-4)"/>
    <text x="-50" y="94" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" font-weight="600" fill="white" opacity="0.7">SERVE</text>

    <!-- Connecting flow arrows -->
    <path d="M 0 -90 L 0 -76" stroke="white" stroke-width="2" opacity="0.3" marker-end="none"/>
    <path d="M 0 -22 L 0 -8" stroke="white" stroke-width="2" opacity="0.3"/>
    <path d="M 0 46 L 0 60" stroke="white" stroke-width="2" opacity="0.3"/>

    <!-- Small arrow tips -->
    <polygon points="-4,-76 4,-76 0,-72" fill="white" opacity="0.3"/>
    <polygon points="-4,-8 4,-8 0,-4" fill="white" opacity="0.3"/>
    <polygon points="-4,60 4,60 0,64" fill="white" opacity="0.3"/>
  </g>
</svg>