<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="prism-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="prism-shadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <!-- Concept B: Funnel Prism — wide top compressing to narrow bottom -->
  <g transform="translate(256, 256)">
    <!-- Main prism face — front -->
    <polygon points="-120,-140 120,-140 60,140 -60,140" fill="url(#prism-grad)"/>
    <!-- Right facet — darker for 3D depth -->
    <polygon points="120,-140 140,-120 80,150 60,140" fill="url(#prism-shadow)"/>
    <!-- Top facet -->
    <polygon points="-120,-140 120,-140 140,-120 -100,-120" fill="#FBBF24" opacity="0.3"/>
    <!-- Subtle inner lines showing compression -->
    <line x1="-90" y1="-80" x2="90" y2="-80" stroke="white" stroke-width="1.5" opacity="0.25"/>
    <line x1="-78" y1="-20" x2="78" y2="-20" stroke="white" stroke-width="1.5" opacity="0.2"/>
    <line x1="-68" y1="40" x2="68" y2="40" stroke="white" stroke-width="1.5" opacity="0.15"/>
    <line x1="-62" y1="100" x2="62" y2="100" stroke="white" stroke-width="1.5" opacity="0.1"/>
    <!-- Small concentrated output glow -->
    <ellipse cx="0" cy="150" rx="30" ry="6" fill="#0D9488" opacity="0.3"/>
  </g>
</svg>