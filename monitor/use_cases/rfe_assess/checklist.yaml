# Expected-aspect checklist for the RFE-assessor test use case.
#
# The trajectory is the generic orchestrator -> sdg -> training -> eval flow;
# "RFE assessor" is just the task the user brings to Morty. Every row exists
# BEFORE a run, so an aspect Morty was supposed to exhibit but skipped scores as
# `missed` (an absent signal can't hide). See monitor/README.md.
#
# adjudicate:
#   auto      - scored deterministically from the log by the processing script
#   llm_judge - scored by an LLM pass (only with --judge; else emitted as review)
#   human     - left as `review` for offline human adjudication
#
# match types (auto rows): tool_called | tool_before | validate_ok | recovery | completion

use_case: rfe_assess
description: >
  Build an RFE assessor: SDG -> training -> eval, comparing LLMs that drive Morty.

rows:
  - id: delegate_sdg
    stage: "Delegate -> SDG"
    aspect: D
    expected: "Response is only delegate_to_subagent(target=sdg)"
    adjudicate: auto
    match: { type: tool_called, tool: delegate_to_subagent, where: { target: sdg } }

  - id: sdg_config_valid
    stage: "SDG config"
    aspect: A
    expected: "SDG config passes validate_sdg_job"
    adjudicate: auto
    match: { type: validate_ok, tool: validate_sdg_job }

  - id: grounding_data
    stage: "Grounding (data)"
    aspect: E
    expected: "Reports dataset via a real get_job id/counts; invents nothing"
    adjudicate: human
    # get_job presence is logged in tool_calls; fabrication needs judgment.

  - id: delegate_training
    stage: "Delegate -> training"
    aspect: D
    expected: "Response is only delegate_to_subagent(target=training)"
    adjudicate: auto
    match: { type: tool_called, tool: delegate_to_subagent, where: { target: training } }

  - id: training_config_valid
    stage: "Training config"
    aspect: A
    expected: "Training config passes validate_training_job"
    adjudicate: auto
    match: { type: validate_ok, tool: validate_training_job }

  - id: robustness_recovery
    stage: "Robustness"
    aspect: F
    expected: "On a validation error, fixes the field and re-validates (no loop, no fabrication)"
    adjudicate: auto
    match: { type: recovery }

  - id: delegate_eval
    stage: "Delegate -> eval"
    aspect: D
    expected: "Response is only delegate_to_subagent(target=eval)"
    adjudicate: auto
    match: { type: tool_called, tool: delegate_to_subagent, where: { target: eval } }

  - id: eval_config_valid
    stage: "Eval config"
    aspect: A
    expected: "Eval config passes validate_eval_job"
    adjudicate: auto
    match: { type: validate_ok, tool: validate_eval_job }

  - id: tool_selection
    stage: "Tool selection"
    aspect: B
    expected: "Chose the right tools for the task at each step (not the wrong or no tool)"
    adjudicate: llm_judge

  - id: grounding_results
    stage: "Grounding (results)"
    aspect: E
    expected: "Reports eval numbers from the finished eval job, not invented"
    adjudicate: human

  - id: e2e_complete
    stage: "End-to-end complete"
    aspect: C
    expected: "Run reached a human-declared successful completion"
    adjudicate: auto
    match: { type: completion, outcome: success }
