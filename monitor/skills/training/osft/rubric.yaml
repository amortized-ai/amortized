# Graded adherence rubric for the Training OSFT sub-skill.
# Ordered decomposition of agents/training/skills/knowledge-ingestion/osft/guide.md.
# See sdg/task-distillation/rubric.yaml for the scoring convention.
skill: training/osft
role: training
guide: agents/training/skills/knowledge-ingestion/osft/guide.md
gate: { type: skill_loaded, role: training, skill: "training-knowledge-ingestion-osft" }
scoring: weighted
steps:
  - id: reads_supported_models
    order: 1
    weight: 1
    description: >
      Reads skills/training/supported_models.json before proposing a base model
      (guide Step 1).
    detect:
      { type: tool_called, tool: read, where: { role: training }, output_contains: "supported_models.json" }

  - id: model_from_supported_file
    order: 2
    weight: 2
    description: >
      The agent presents ONLY models from skills/training/supported_models.json and
      does not invent other sizes or HuggingFace IDs. `wrong` if a presented model is
      not from that file.
    detect: { type: llm_judge }

  - id: key_params_in_table
    order: 3
    weight: 2
    description: >
      The confirmation table includes the OSFT-critical parameters the guide says to
      ALWAYS show — unfreeze_rank_ratio and effective_batch_size — even at defaults.
      `wrong` if the confirmation omits either.
    detect: { type: llm_judge }

  - id: params_justified
    order: 4
    weight: 1
    description: >
      The agent justifies its hyperparameter choices (epochs / learning_rate tied to
      dataset and model size, max_length tied to the SDG task) rather than presenting
      static defaults with no reasoning. `wrong` if values are shown with no rationale.
    detect: { type: llm_judge }

  - id: single_gpu_no_gpu_question
    order: 5
    weight: 1
    description: >
      The agent uses a single GPU (nproc_per_node 1) and does NOT ask the user how
      many GPUs they have or offer GPU-count options. `wrong` if it asks the user to
      choose a GPU count.
    detect: { type: llm_judge }

  - id: emits_training_card
    action_required: true
    weight: 2
    description: Emits the training config / VRAM card (validate_training_job) after gathering requirements.
    detect: { type: action_emitted, emits: [validate_training_job] }
