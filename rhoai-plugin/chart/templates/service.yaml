apiVersion: v1
kind: Service
metadata:
  name: {{ include "amortized-studio.fullname" . }}
  namespace: {{ include "amortized-studio.namespace" . }}
  labels:
    {{- include "amortized-studio.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "amortized-studio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
