                - generic [ref=e157]:
                  - paragraph [ref=e158]: You can run distributed training workloads on Red Hat OpenShift AI by using Kubeflow Trainer v2. Kubeflow Trainer v2 replaces the framework-specific custom resource definitions (CRDs) from Training Operator v1, such as PyTorchJob, with a unified TrainJob API and pre-built ClusterTrainingRuntime infrastructure templates.
                  - generic [ref=e159]:
