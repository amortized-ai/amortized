                    - paragraph [ref=e1703]: Fine-tuning is the process of customizing a Large Language Model (LLM) for a specific task by using labelled data. You can use Kubeflow Trainer v2 with Training Hub runtimes and the Kubeflow Python SDK to fine-tune LLMs in Red Hat OpenShift AI.
                    - paragraph [ref=e1704]: "Red Hat OpenShift AI supports the following fine-tuning algorithms through Training Hub:"
                    - generic [ref=e1706]:
                      - term [ref=e1707]: Orthogonal Subspace Fine-Tuning (OSFT)
                      - definition [ref=e1708]: Enables continual learning of pre-trained or instruction-tuned models without catastrophic forgetting. OSFT does not require a supplementary dataset to maintain the distribution of the original model.
                      - term [ref=e1709]: Supervised Fine-Tuning (SFT)
                      - definition [ref=e1710]: Standard fine-tuning for task adaptation using PyTorch Fully Sharded Data Parallel (FSDP) to distribute training across multiple GPUs and nodes.
