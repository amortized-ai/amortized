                      - paragraph [ref=e187]:
                        - text: ClusterTrainingRuntimes are cluster-scoped infrastructure templates that define the distributed training environment for your training jobs. They are created by the platform administrator and are available to all projects in the cluster. They replace the per-job infrastructure configuration that was required in Training Operator v1 (
                        - code [ref=e188]: PyTorchJob
                        - text: ), where you had to specify the full pod specification, environment variables, and distributed training setup for every job.
                      - paragraph [ref=e189]:
