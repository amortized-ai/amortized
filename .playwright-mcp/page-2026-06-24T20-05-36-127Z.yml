        - 'heading "Aider: The Git-Native Pair Programmer" [level=3] [ref=e457]'
        - paragraph [ref=e458]:
          - link "Aider" [ref=e459] [cursor=pointer]:
            - /url: https://aider.chat/
          - text: "(GitHub:"
          - link "Aider-AI/aider" [ref=e460] [cursor=pointer]:
            - /url: https://github.com/Aider-AI/aider
          - text: ) remains the gold standard for developers who want bulletproof Git integration and precise, reviewable AI edits. As of August 2025, v0.86.0 added support for all GPT-5 models, Grok-4, and Gemini 2.5 Flash Lite. It has 42.4K stars and 130+ contributors.
        - paragraph [ref=e461]:
          - strong [ref=e462]: "Installation:"
        - code [ref=e465]:
          - generic [ref=e467]: "# Recommended: isolated install via uv"
          - generic [ref=e469]: uv tool install aider-chat
          - generic [ref=e471]: aider
          - generic [ref=e474]: "# Or via pip/pipx"
          - generic [ref=e476]: pipx install aider-chat
        - paragraph [ref=e477]:
          - strong [ref=e478]: "What makes it stand out:"
          - text: Aider’s killer feature is that it treats Git as a first-class citizen. Every change is automatically committed with a descriptive, well-formatted commit message. You can
          - code [ref=e479]: git diff
          - text: ","
          - code [ref=e480]: git log
          - text: ", and"
          - code [ref=e481]: git revert
          - text: AI changes with standard tools — meaning there’s always a clean undo path. No other tool in this list matches Aider’s discipline here.
          - 'link "Source: Aider docs" [ref=e482] [cursor=pointer]':
            - /url: https://aider.chat/docs/
        - paragraph [ref=e483]: "Key features and recent additions:"
        - list [ref=e484]:
          - listitem [ref=e485]:
            - strong [ref=e486]: Structured Mode
            - text: ": A plan-based approach that tracks progress, maintains context across coding sessions, and breaks complex features into managed tasks with automated checklist updates. This is Aider’s answer to the “lost context” problem."
          - listitem [ref=e487]:
            - strong [ref=e488]: 130+ language support
            - text: ": Version 0.77.0 (March 2025) added 130 languages with linter support and 20 with repo-map support."
            - 'link "Source: Aider releases" [ref=e489] [cursor=pointer]':
              - /url: https://github.com/Aider-AI/aider/releases
          - listitem [ref=e490]:
            - strong [ref=e491]: IDE watch mode
            - text: ": Add"
            - code [ref=e492]: "# aider: ..."
            - text: comments in your IDE, and Aider picks them up and acts on them automatically.
          - listitem [ref=e493]:
            - strong [ref=e494]: Images and web pages
            - text: ": Add visual context — screenshots, reference docs, architecture diagrams — directly into the chat."
          - listitem [ref=e495]:
            - strong [ref=e496]: Voice-to-code
            - text: ": Speak your coding requests aloud for hands-free development."
          - listitem [ref=e497]:
            - strong [ref=e498]: Broad model support
            - text: ": Works with Claude Sonnet 4/Opus 4, GPT-5, Gemini 2.5/3, DeepSeek R1 & V3, Grok models, and local Ollama instances."
            - 'link "Source: Aider LLM support" [ref=e499] [cursor=pointer]':
              - /url: https://aider.chat/docs/
          - listitem [ref=e500]:
            - strong [ref=e501]:
              - code [ref=e502]: /thinking-tokens
              - text: and
              - code [ref=e503]: /reasoning-effort
            - text: ": In-chat commands for fine-grained control over model reasoning depth."
          - listitem [ref=e504]:
            - strong [ref=e505]: Repo map
            - text: ": Builds a structural map of your entire codebase, helping the model understand cross-file relationships even in large monorepos."
          - listitem [ref=e506]:
            - strong [ref=e507]: Automatic linting and testing
            - text: ": Runs your linter and test suite after every change, then fixes detected issues automatically."
        - paragraph [ref=e508]:
          - strong [ref=e509]: "Where it struggles:"
          - text: Aider is a pair programmer, not a fully autonomous agent. It excels at focused, file-level edits but isn’t designed for the kind of system-wide orchestration that Claude Code or Goose handle. If you need to scaffold a complete new service from scratch, Aider’s incremental approach can feel limiting.
        - 'heading "Codex CLI: The New Speed King" [level=3] [ref=e510]'
        - paragraph [ref=e511]:
          - link "Codex CLI" [ref=e512] [cursor=pointer]:
            - /url: https://github.com/openai/codex
          - text: (the agent, built in Rust) is OpenAI’s terminal coding agent. As of June 2026 it took the
          - strong [ref=e513]: "#1 spot on Terminal-Bench 2.1"
          - text: "at 83.4% — outpacing Claude Code at 78.9%. The model:"
          - strong [ref=e514]: GPT-5.5
          - text: ", OpenAI’s latest code-optimized model. Unlike SWE-bench (which primarily measures the model’s code-fixing ability), Terminal-Bench tests the"
          - emphasis [ref=e515]: entire agent stack
          - text: — planning, tool use, shell execution, and multi-step reasoning. Codex CLI + GPT-5.5 wins here.
          - 'link "Source: Morphllm" [ref=e516] [cursor=pointer]':
            - /url: https://www.morphllm.com/best-ai-coding-agents-2026
        - paragraph [ref=e517]:
          - strong [ref=e518]: "Installation:"
        - code [ref=e521]:
          - generic [ref=e523]: "# macOS"
          - generic [ref=e525]: brew install openai-codex-cli
          - generic [ref=e528]: "# Or download from GitHub releases"
          - generic [ref=e530]: curl -L https://github.com/openai/codex/releases/latest/download/codex-x86_64-apple-darwin.tar.gz | tar -xz
        - paragraph [ref=e531]:
          - strong [ref=e532]: "What makes it stand out:"
          - text: Codex CLI with GPT-5.5 delivers the best raw coding speed in the market. On SWE-bench, GPT-5.5 scores 82.1%. More importantly, Terminal-Bench 2.1 — which tests the
          - emphasis [ref=e533]: entire agent stack
          - text: including planning, tool use, and shell execution — puts Codex CLI clearly in the lead.
        - paragraph [ref=e534]: "Key features:"
        - list [ref=e535]:
          - listitem [ref=e536]:
            - strong [ref=e537]: Three-tier permission system
            - text: ": Read-only, auto (approves safe commands), and full autonomy."
          - listitem [ref=e538]:
            - strong [ref=e539]: Included with ChatGPT Plus ($20/month)
            - text: ": If you already have a ChatGPT subscription, Codex CLI costs nothing extra."
          - listitem [ref=e540]:
            - strong [ref=e541]: 75% prompt caching
            - text: ": API calls with cached prompts cost $1.50/$6 per million tokens — the cheapest option for heavy users."
            - 'link "Source: OpenAI pricing" [ref=e542] [cursor=pointer]':
              - /url: https://developers.openai.com/codex/pricing/
          - listitem [ref=e543]:
            - strong [ref=e544]: Fast and lightweight
            - text: ": Built in Rust, near-instant startup."
        - paragraph [ref=e545]:
          - strong [ref=e546]: "Where it struggles:"
          - text: Codex CLI locks you into OpenAI’s ecosystem — no local models, no alternative providers. If Claude Opus 4.8 leapfrogs GPT-5.5 next month, you can’t just swap the model. And it still lacks MCP support, which limits extensibility.
        - 'heading "Goose: The Autonomous System Architect" [level=3] [ref=e547]'
        - paragraph [ref=e548]:
          - link "Goose" [ref=e549] [cursor=pointer]:
            - /url: https://github.com/block/goose
          - text: (33.6K stars, 3.1k forks) is Block’s (formerly Square) open-source AI agent, designed for complex, system-level automation. As of March 2026, v1.28.0 added adversarial agent protection, Claude adaptive thinking support, and MCP Apps migration. Block deployed it to all 12,000 employees by October 2025, with engineers reporting 8–10 hours saved per week.
          - 'link "Source: Block blog" [ref=e550] [cursor=pointer]':
            - /url: https://github.com/block/goose
        - paragraph [ref=e551]:
          - strong [ref=e552]: "Installation:"
        - code [ref=e555]:
          - generic [ref=e557]: "# macOS via Homebrew"
          - generic [ref=e559]: brew install block-goose-cli
          - generic [ref=e562]: "# See full installation guide:"
          - generic [ref=e564]: "# https://block.github.io/goose/docs/getting-started/installation"
        - paragraph [ref=e565]:
          - strong [ref=e566]: "What makes it stand out:"
          - text: Goose is built for planning and orchestration at scale. It doesn’t just edit code — it designs systems. Before touching anything, Goose asks clarifying questions and breaks requests into verifiable steps. This structured approach makes it exceptionally good at scaffolding new microservices, orchestrating deployments, or migrating between frameworks. If you’re running complex infrastructure — something I’ve written about in my
          - link "Kustomize vs Helm comparison" [ref=e567] [cursor=pointer]:
            - /url: /post/kustomize-vs-helm-2026
          - text: / — Goose integrates naturally into that workflow.
        - paragraph [ref=e568]: "Key features:"
        - list [ref=e569]:
          - listitem [ref=e570]:
            - strong [ref=e571]: Recipes
            - text: ": Reusable, pre-defined workflows that can run as sub-agents. Think of them as composable automation playbooks."
          - listitem [ref=e572]:
            - strong [ref=e573]: MCP-UI rendering
            - text: ": The desktop GUI renders interactive MCP-UI widgets — visual dashboards, forms, progress bars — not just text. This is unique among CLI agents."
          - listitem [ref=e574]:
            - strong [ref=e575]: Custom Distributions
            - text: ": Build your own branded Goose distro with preconfigured providers, extensions, and branding. Ideal for platform engineering teams standardizing on a specific toolchain."
          - listitem [ref=e576]:
            - strong [ref=e577]: Desktop app + CLI
            - text: ": Available as both, giving flexibility depending on the task."
          - listitem [ref=e578]:
            - strong [ref=e579]: Multi-model configuration
            - text: ": Use different LLMs for different tasks within a single session to optimize cost and capability."
          - listitem [ref=e580]:
            - strong [ref=e581]: Responsible AI guide
            - text: ": Ships with formal documentation on"
            - link "safe AI-assisted coding practices" [ref=e582] [cursor=pointer]:
              - /url: https://goose-docs.ai/
            - text: .
        - paragraph [ref=e583]:
          - strong [ref=e584]: "2026 roadmap highlights:"
        - list [ref=e585]:
          - listitem [ref=e586]:
            - strong [ref=e587]: Meta-agent orchestration
            - text: ": Multiple sub-agents running in parallel with task and progress tracking."
          - listitem [ref=e588]:
            - strong [ref=e589]: Built-in local inference
            - text: ": Ship open model downloads directly in the app — no external API needed."
          - listitem [ref=e590]:
            - strong [ref=e591]: Peer-to-peer compute
            - text: ": Exploring decentralized compute for distributed agent workloads."
        - paragraph [ref=e592]:
          - strong [ref=e593]: "Where it struggles:"
          - text: Goose’s planning-first approach can feel slow for simple, surgical edits. When I just want to rename a function across three files, I don’t need a structured plan — I need Aider. Goose also has a steeper learning curve than the other tools due to its recipe and extension system.
        - 'heading "New on the Scene: Cursor CLI, Kilo, Grok Build, Qwen Code" [level=2] [ref=e594]'
        - paragraph [ref=e595]: "The CLI coding space is moving fast enough that new entrants appear quarterly. Here are four worth watching as of June 2026:"
        - paragraph [ref=e596]:
          - strong [ref=e597]: Cursor CLI.
          - text: "Cursor — the IDE that’s been eating VS Code’s lunch — now ships a CLI agent alongside its editor. If you’re already in the Cursor ecosystem, it’s a natural extension: same model routing, same keyboard shortcuts, but terminal-native. Priced at $20/month for Pro."
        - paragraph [ref=e598]:
          - strong [ref=e599]: Kilo CLI.
          - text: "A newcomer from kilo.ai that positions itself as a “best of both worlds” agent — fast startup like Codex, planning capabilities like Goose. Too early for reliable benchmark data, but the approach is interesting: it can hot-swap between models mid-task based on complexity. Free tier available."
        - paragraph [ref=e600]:
          - strong [ref=e601]: Grok Build.
          - text: xAI’s entry into coding agents, leveraging the Grok 4 model. Currently in preview with limited availability. Notable for its massive context window (2M tokens) and real-time web access via X/Twitter data integration. Unclear pricing as of June 2026.
        - paragraph [ref=e602]:
          - strong [ref=e603]: Qwen Code.
          - text: Alibaba’s Qwen team released an open-source coding CLI built on their Qwen 3-Coder model. It’s the only major entrant with first-class Chinese/English bilingual support, and it’s fully open-source (Apache 2.0). Still early — weaker on SWE-bench than Western models, but improving fast.
        - paragraph [ref=e604]:
          - strong [ref=e605]: Pi
          - text: (
          - link "pi.dev" [ref=e606] [cursor=pointer]:
            - /url: https://pi.dev/
          - text: "). An MIT-licensed, ultra-minimal agent harness from earendil-works that’s been getting attention from the developer community. Unlike the heavyweights, Pi strips the agent down to its essentials — a thin TypeScript layer over 15+ model providers (Anthropic, OpenAI, Google, etc.) with four modes: interactive, JSON, RPC, and SDK. Armin Ronacher (creator of Flask) described it as “a glimpse into the future of software.” It’s also the engine powering OpenClaw. Best for developers who want full control over their agent behavior without a framework dictating the workflow."
          - 'link "Source: Pi docs" [ref=e607] [cursor=pointer]':
            - /url: https://pi.dev/
          - text: ","
          - link "Armin Ronacher’s review" [ref=e608] [cursor=pointer]:
            - /url: https://lucumr.pocoo.org/2026/1/31/pi/
        - paragraph [ref=e609]: None of these five are ready to displace the top-tier tools yet, but Cursor CLI and Pi are the ones to watch. Cursor’s existing user base gives it distribution muscle; Pi’s minimal philosophy and extensibility make it the most hackable agent in the space.
