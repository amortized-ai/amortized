            - row "Best For Git-disciplined, reviewable changes Multi-file scaffolding, rapid iteration" [ref=e363]:
              - cell "Best For" [ref=e364]:
                - strong [ref=e365]: Best For
              - cell "Git-disciplined, reviewable changes" [ref=e366]
              - cell "Multi-file scaffolding, rapid iteration" [ref=e367]
            - row "MCP Support No (as of Apr 2026) Yes" [ref=e368]:
              - cell "MCP Support" [ref=e369]:
                - strong [ref=e370]: MCP Support
              - cell "No (as of Apr 2026)" [ref=e371]
              - cell "Yes" [ref=e372]
            - row "Stars 44K 172K" [ref=e373]:
              - cell "Stars" [ref=e374]:
