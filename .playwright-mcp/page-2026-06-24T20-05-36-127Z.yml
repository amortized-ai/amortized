        - 'heading "AIDER VS OPENCODE VS CLAUDE CODE: WHICH WINS IN JUNE 2026?" [level=1] [ref=e51]'
        - list [ref=e52]:
          - listitem [ref=e53]:
            - emphasis [ref=e54]: 
            - text: 25/2/2026
          - listitem [ref=e55]:
            - emphasis
            - text: Updated 13/6/2026
