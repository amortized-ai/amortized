        - paragraph [ref=e181]:
          - strong [ref=e182]: "Agents vs. Models: Know the Difference."
          - text: "Before we dive in, a distinction that trips up every comparison article: the"
          - emphasis [ref=e183]: agent
          - text: is the CLI tool — the harness that reads your files, executes shell commands, manages Git, and orchestrates the workflow. The
          - emphasis [ref=e184]: model
          - text: is the AI brain plugged into that harness — Opus 4.8, GPT-5.5, Gemini 3. The benchmark scores in the table above reflect the
          - emphasis [ref=e185]: agent+model combination
          - text: ", not the model in isolation. Claude Code with Opus 4.8 scores 88.6% on SWE-bench because of both the model’s reasoning AND the agent’s scaffolding. The same model plugged into a weaker harness would score lower. Throughout this article, I’ll name both components: the tool you install, and the model you configure it to use."
        - heading "Why the Terminal Is Winning Again" [level=2] [ref=e186]
        - paragraph [ref=e187]: I keep coming back to terminal-first agents for two reasons. First, context boundaries are explicit. An IDE extension tends to “help” by analyzing whatever file is open, even when it’s irrelevant. A CLI agent operates on the files it decides are necessary for the problem you describe, and nothing else.
        - paragraph [ref=e188]:
          - text: "Second, these aren’t auto-completers anymore. Claude Code, OpenCode, and Goose are fully autonomous agents: they plan, execute shell commands, read outputs, fix failures, and loop until the tests pass. That level of autonomy simply doesn’t exist in a tab-completion plugin. If you’ve worked with the"
          - link "Model Context Protocol (MCP)" [ref=e189] [cursor=pointer]:
            - /url: https://en.wikipedia.org/wiki/Model_Context_Protocol
          - text: — which I covered in my
          - link "earlier deep dive on MCP" [ref=e190] [cursor=pointer]:
            - /url: /post/2025-03-09-key-insights-on-the-anthropic-model-context-protocol
          - text: / — you’ll recognize these tools as MCP clients on steroids.
        - paragraph [ref=e191]: "The Heavyweights: Claude Code and Codex CLI"
        - paragraph [ref=e192]: When the foundation model providers ship their own CLI agents, the integration depth is unmatched. As of June 2026, the two heaviest hitters are Claude Code and Codex CLI — and they’ve swapped positions on the benchmark leaderboard.
        - heading "Claude Code" [level=3] [ref=e193]
        - paragraph [ref=e194]:
          - link "Claude Code" [ref=e195] [cursor=pointer]:
            - /url: https://github.com/anthropics/claude-code
          - text: (the agent — 96K stars, 8k forks) remains the gold standard for autonomous debugging. As of June 2026, the agent is at
          - strong [ref=e196]: v2.1.172
          - text: "with 250+ releases. The model powering it:"
          - strong [ref=e197]: Claude Opus 4.8
          - text: achieves an 88.6% score on SWE-Bench Verified — a nearly 8-point jump from Opus 4.6 in April. That’s the agent+model combo that currently holds the SWE-bench crown.
          - 'link "Source: SWE-Bench leaderboard" [ref=e198] [cursor=pointer]':
            - /url: https://www.marc0.dev/en/leaderboard
        - paragraph [ref=e199]:
          - strong [ref=e200]: "Installation (as of June 2026):"
        - code [ref=e203]:
          - generic [ref=e205]: "# macOS / Linux (recommended)"
          - generic [ref=e207]: curl -fsSL https://claude.ai/install.sh | bash
          - generic [ref=e210]: "# Homebrew"
          - generic [ref=e212]: brew install --cask claude-code
          - generic [ref=e215]: "# Windows"
          - generic [ref=e217]: winget install Anthropic.ClaudeCode
        - paragraph [ref=e218]:
          - strong [ref=e219]: "A quick note on the Pro tier situation:"
          - text: On April 21, 2026, Anthropic quietly removed Claude Code from the $20/month Pro tier — restricting it to the $100-200/month Max plan. After community backlash, access was restored. The episode exposed how fragile provider-locked workflows can be. If you’re building production tooling around Claude Code, budget for the Max plan or keep a backup agent in your toolkit.
          - 'link "Source: Anthropic April 23 postmortem" [ref=e220] [cursor=pointer]':
            - /url: https://www.anthropic.com/engineering/april-23-postmortem
        - paragraph [ref=e221]:
          - strong [ref=e222]: "What makes it stand out:"
          - text: "Claude Code’s multi-step reasoning remains the strongest in this category. I regularly point it at a failing test suite with zero context and watch it navigate the call stack across multiple files, identify the root cause, deploy a fix, and verify it — autonomously. Key features as of June 2026:"
        - list [ref=e223]:
          - listitem [ref=e224]:
            - strong [ref=e225]: Skills as workflow packages
            - text: ": Anthropic transformed Skills from simple instructions into full workflow packages bundling commands, scripts, and context — executable on demand."
          - listitem [ref=e226]:
            - strong [ref=e227]: Nested sub-agents
            - text: "(v2.1.172): Sub-agents can now spawn their own sub-agents, creating AI agent hierarchies for complex parallel tasks."
          - listitem [ref=e228]:
            - strong [ref=e229]: Background agents
            - text: ": Sub-agents run concurrently without blocking your main conversation."
          - listitem [ref=e230]:
            - strong [ref=e231]: Hooks
            - text: ": Deterministic automation at lifecycle points — auto-run linters, formatters, or test suites on every change. HTTP hooks can POST JSON to external services."
          - listitem [ref=e232]:
            - strong [ref=e233]: Plugins
            - text: ": Shareable packages bundling slash commands, MCP servers, agents, and hooks into installable units."
          - listitem [ref=e234]:
            - strong [ref=e235]: Remote control
            - text: "(research preview): Continue local coding sessions from a mobile device or any browser."
          - listitem [ref=e236]:
            - strong [ref=e237]: Checkpoints
            - text: ": Automatic code state snapshots before changes, enabling easy rollback."
          - listitem [ref=e238]:
            - strong [ref=e239]: Worktree isolation
            - text: ": Agents work in dedicated Git worktrees to prevent conflicts."
        - paragraph [ref=e240]:
          - strong [ref=e241]: "Claude Fable 5 (New):"
          - text: "Anthropic shipped Fable 5 on June 9, 2026 — a Mythos-class model available across all Claude surfaces including Claude Code. It’s the same underlying architecture as Mythos 5 but with guardrails, priced at $50/million output tokens (roughly 2x Opus). Early impressions from Simon Willison describe it as “relentlessly proactive” — it doesn’t wait for you to ask, it identifies problems and proposes solutions unprompted. For coding, this means it can spot architectural issues in your codebase that you didn’t explicitly ask about. The catch: it’s expensive, and you need a Max plan to access it in Claude Code."
          - 'link "Source: Simon Willison, “Claude Fable 5”" [ref=e242] [cursor=pointer]':
            - /url: https://simonwillison.net/2026/Jun/9/claude-fable-5/
