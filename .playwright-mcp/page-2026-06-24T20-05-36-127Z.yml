        - paragraph [ref=e378]:
          - strong [ref=e379]: "When to pick Aider:"
          - text: You want bulletproof Git history. Every change is automatically committed with a descriptive message — you can always
          - code [ref=e380]: git revert
          - text: or
          - code [ref=e381]: git log
          - text: your way out of any mistake. You prefer incremental, file-level edits over full automation. You need the strongest lint-and-test loop (runs after every change). You value the Structured Mode for tracking progress across long coding sessions.
        - paragraph [ref=e382]:
          - strong [ref=e383]: "When to pick OpenCode:"
          - text: You want provider flexibility — use your existing ChatGPT Plus or Copilot subscription, or switch between Claude, GPT, Gemini, Groq, and local Ollama without reconfiguration. You need the
          - code [ref=e384]: build
          - text: agent for scaffolding new services from scratch. You want MCP extensibility for connecting external tools. You prefer the TUI + desktop app combo over pure CLI.
        - paragraph [ref=e385]:
          - strong [ref=e386]: "The 2026 wild card:"
          - text: In early 2026, Anthropic briefly blocked OpenCode from accessing the Claude API. Access was restored after community backlash, but it exposed the fragility of provider-dependent tools. Aider’s any-OpenAI-compatible-API approach is more resilient here — your models keep working even if a provider changes their terms.
          - 'link "Source: NxCode" [ref=e387] [cursor=pointer]':
            - /url: https://www.nxcode.io/resources/news/aider-vs-opencode-ai-coding-cli-2026
        - paragraph [ref=e388]:
          - strong [ref=e389]: "Bottom line:"
          - text: Aider is the safer bet for Git discipline and provider resilience. OpenCode wins on flexibility and multi-model convenience. If you’re already paying for ChatGPT Plus, OpenCode effectively costs nothing extra. If you’re budget-conscious and have your own API keys, Aider’s Git-native workflow is worth the learning curve.
        - 'heading "OpenCode: The Provider-Agnostic Powerhouse" [level=3] [ref=e390]'
        - paragraph [ref=e391]:
          - link "OpenCode" [ref=e392] [cursor=pointer]:
            - /url: https://opencode.ai/
          - text: "(GitHub:"
          - link "anomalyco/opencode" [ref=e393] [cursor=pointer]:
            - /url: https://github.com/anomalyco/opencode
          - text: ) has exploded in popularity —
          - strong [ref=e394]: 172K stars
          - text: (up from 131K in April), 778+ contributors, 800+ releases, and over 2.5 million monthly active developers. It’s built by the team behind
          - link "SST" [ref=e395] [cursor=pointer]:
            - /url: https://sst.dev
          - text: and
          - link "terminal.shop" [ref=e396] [cursor=pointer]:
