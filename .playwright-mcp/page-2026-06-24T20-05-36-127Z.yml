        - paragraph [ref=e281]: "The benchmarks tell a nuanced story. Claude Opus 4.8 dominates SWE-bench — the measure of raw code-fixing ability. But Codex CLI with GPT-5.5 leads Terminal-Bench, which tests the full agent stack: planning, tool use, shell execution, and multi-step reasoning. Agent scaffolding matters enormously — the same model can score 10-20 points higher with a well-designed harness around it."
        - paragraph [ref=e282]:
          - strong [ref=e283]: "Where it struggles:"
          - text: The subscription gate remains a barrier for casual use. And for smaller, focused tasks, the autonomy can be overkill — sometimes you just want a quick edit, not a planning session.
        - heading "Antigravity CLI (Formerly Gemini CLI)" [level=3] [ref=e284]
        - paragraph [ref=e285]:
          - text: Google’s
          - link "Gemini CLI" [ref=e286] [cursor=pointer]:
            - /url: https://github.com/google-gemini/gemini-cli
          - text: (99K stars, 12.6k forks) has been rebranded to
          - strong [ref=e287]: Antigravity CLI
          - text: as of mid-2026 and moved from an npm-distributed tool to a native binary. The old npm package still works for legacy users, but new installs use platform-native scripts.
          - 'link "Source: Antigravity CLI docs" [ref=e288] [cursor=pointer]':
            - /url: https://antigravity.google/docs/cli-install
        - paragraph [ref=e289]:
          - strong [ref=e290]: "Installation:"
        - code [ref=e293]:
          - generic [ref=e295]: "# Run instantly without installing"
          - generic [ref=e297]: curl -fsSL https://antigravity.google/install.sh | bash
          - generic [ref=e300]: "# Global install via npm"
          - generic [ref=e302]: sudo apt install antigravity
          - generic [ref=e305]: "# macOS / Linux"
        - paragraph [ref=e306]: Authenticate with a personal Google account (OAuth), a Gemini API key, or Vertex AI credentials.
        - paragraph [ref=e307]:
          - strong [ref=e308]: "What makes it stand out:"
          - text: The free tier remains the most generous in the market — 60 requests per minute and 1,000 requests per day with a personal Google account, powered by
          - strong [ref=e309]: Gemini 3
          - text: models with a
          - strong [ref=e310]: 1M token context window
          - text: . No credit card required. This is the lowest-friction entry point for anyone wanting to try agentic CLI coding.
        - paragraph [ref=e311]: "Key features as of June 2026:"
        - list [ref=e312]:
          - listitem [ref=e313]:
            - strong [ref=e314]: Built-in Google Search grounding
            - text: ": Queries augmented with real-time web information."
          - listitem [ref=e315]:
            - strong [ref=e316]: Multimodal input
            - text: ": Generate apps from PDFs, images, or hand-drawn sketches."
          - listitem [ref=e317]:
            - strong [ref=e318]: GEMINI.md files
            - text: ": Project-level context files that tailor the agent’s behavior."
          - listitem [ref=e319]:
            - strong [ref=e320]: GitHub Action integration
            - text: ": Automated PR reviews and issue triage."
          - listitem [ref=e321]:
            - strong [ref=e322]: MCP extensibility
            - text: ": Connect to external tools and media generation."
        - paragraph [ref=e323]:
          - strong [ref=e324]: "What to watch:"
          - text: The Antigravity rebrand suggests Google is preparing the CLI for a future where it can use models beyond Gemini. For now, the free tier works exactly as it always has — just under a new name.
        - paragraph [ref=e325]:
          - strong [ref=e326]: "Where it struggles:"
          - text: The search grounding can pull focus from local codebase context. For heavy production use, Vertex AI pricing may apply beyond the free tier.
