        - paragraph [ref=e173]:
          - strong [ref=e174]: "TL;DR:"
          - text: Want best intelligence-per-dollar? → Codex CLI (included with ChatGPT Plus). Want free? → Antigravity CLI. Want Git safety? → Aider. Want provider independence? → OpenCode. Want full autonomy? → Claude Code. Want IDE-native CLI? → Cursor CLI.
