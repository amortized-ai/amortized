type: training
description: LoRA SFT for content moderation — Qwen3 0.6B
config:
  algorithm: sft
  model_name_or_path: Qwen/Qwen3-0.6B

  data_path: training_data.jsonl
  max_length: 1024

  num_train_epochs: 5
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-04
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0

  bf16: true

  use_peft: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

  logging_steps: 10
  save_steps: 500
  report_to: none
  output_dir: output/content-moderator

compute:
  gpus: 1
  min_vram_gb: 8
