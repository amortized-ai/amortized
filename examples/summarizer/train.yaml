type: training
description: LoRA SFT for conversation summarization — Qwen 2.5 1.5B
config:
  algorithm: sft
  model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct

  data_path: training_data.jsonl
  max_length: 4096

  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-04
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0

  bf16: true

  use_peft: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

  gradient_checkpointing: true

  logging_steps: 10
  save_steps: 500
  report_to: none
  output_dir: output/summarizer

compute:
  gpus: 1
  min_vram_gb: 8
