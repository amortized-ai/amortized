type: eval
description: Evaluate entity extraction accuracy
config:
  model_name: tuned
  accuracy_fields:
    - entity_type
  max_samples: 50
  temperature: 0.0
  judge_model: openai/gpt-5.4
  judge_prompt: >-
    An entity extraction task was performed. Evaluate if the extracted
    entities are correct and complete.

    Source text: {request}
    Extracted entities: {response}

    Are the extractions correct?
