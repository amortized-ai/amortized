name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: amortized_test
          POSTGRES_USER: amortized
          POSTGRES_PASSWORD: amortized
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U amortized -d amortized_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      AMORTIZED_DATABASE_URL: postgresql://amortized:amortized@localhost:5432/amortized_test
      AMORTIZED_TEST_DATABASE_URL: postgresql://amortized:amortized@localhost:5432/amortized_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check src/ tests/

      - name: Check migrations for unsafe operations
        run: |
          if grep -rEi 'DROP COLUMN|RENAME COLUMN|RENAME TABLE|ALTER COLUMN.*TYPE' \
            src/amortized/db/migrations/versions/*.py; then
            echo "::error::Unsafe migration detected — breaking schema changes must be split into two PRs"
            exit 1
          fi

      - name: Type check
        run: mypy src/

      - name: Run migrations
        run: alembic upgrade head

      - name: Test
        run: pytest tests/ -v

      - name: Export OpenAPI spec
        run: python scripts/export_openapi.py

      - name: Verify OpenAPI spec is up to date
        run: git diff --exit-code openapi/v1.json

  studio:
    name: Studio — lint, typecheck, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
