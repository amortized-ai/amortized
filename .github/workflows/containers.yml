name: Build container images

on:
  push:
    branches: [dev, main]
    paths: ['containers/**', 'agent/**', 'src/**', 'studio/**', 'Dockerfile', 'pyproject.toml', 'templates/**', 'examples/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Lightweight images — build on GitHub-hosted runners
  build-light:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [synth, eval]
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/amortized-ai/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: containers/${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Amortized control plane server
  build-amortized:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/amortized-ai/amortized
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Studio frontend — nginx-based static build
  build-studio:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/amortized-ai/studio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v5
        with:
          context: studio
          file: studio/Dockerfile.kind
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # CUDA training image — too large for GitHub runners (~12GB).
  # Build on a self-hosted GPU runner or manually:
  #   podman build -f containers/training/Dockerfile -t ghcr.io/amortized-ai/training:latest . && podman push ghcr.io/amortized-ai/training:latest
  #
  # To enable CI builds, add a self-hosted runner with the 'gpu' label:
  #   https://docs.github.com/en/actions/hosting-your-own-runners
  #
  # build-cuda:
  #   runs-on: [self-hosted, gpu]
  #   strategy:
  #     matrix:
  #       image: [training]
  #   ...
