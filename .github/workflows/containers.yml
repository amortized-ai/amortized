name: Build container images

on:
  push:
    branches: [dev, main]
    paths: ['containers/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - synth
          - eval
          - training-lora
          - training-grpo
          - training-gepa
          - training-sft
          - training-osft
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: containers/${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ghcr.io/amortized-ai/${{ matrix.image }}:latest
            ghcr.io/amortized-ai/${{ matrix.image }}:${{ github.sha }}
