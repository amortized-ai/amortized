name: Build container images

on:
  push:
    branches: [dev, main]
    paths: ['containers/**']
  workflow_dispatch:

jobs:
  # Lightweight images — build on GitHub-hosted runners
  build-light:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [synth, eval]
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: containers/${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ghcr.io/amortized-ai/${{ matrix.image }}:latest
            ghcr.io/amortized-ai/${{ matrix.image }}:${{ github.sha }}

  # CUDA training images — too large for GitHub runners (~12GB each).
  # Build on a self-hosted GPU runner, or manually on the GPU node:
  #   ssh REDACTED_HOST "cd ~/amortized && podman build -f containers/training-lora/Dockerfile -t ghcr.io/amortized-ai/training-lora:latest . && podman push ghcr.io/amortized-ai/training-lora:latest"
  #
  # To enable CI builds, add a self-hosted runner with the 'gpu' label:
  #   https://docs.github.com/en/actions/hosting-your-own-runners
  #
  # build-cuda:
  #   runs-on: [self-hosted, gpu]
  #   strategy:
  #     matrix:
  #       image: [training-lora, training-sft, training-grpo, training-gepa, training-osft]
  #   ...
