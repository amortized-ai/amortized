name: Build studio-gateway image

# The RHOAI studio-gateway: serves the shared Studio SPA and provisions each dashboard
# user's isolated stack (runs helm to install the core chart from OCI + the openshell
# CLI to create the sandboxed Morty). Separate workflow so it can be dispatched on its
# own to build a testable image. The core chart is pulled at runtime, not baked, so the
# build context is just studio/ + studio-gateway/.
on:
  push:
    branches: [main]
    paths: ['studio/**', 'studio-gateway/**', '.github/workflows/studio-gateway-image.yml']
  workflow_dispatch:

jobs:
  build-studio-gateway:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/amortized-ai/studio-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v5
        with:
          # Built from the repo root (the Containerfile needs studio/ + studio-gateway/).
          context: .
          file: studio-gateway/Containerfile
          # amd64 only — the image bakes amd64 helm + the x86_64-musl openshell CLI.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
