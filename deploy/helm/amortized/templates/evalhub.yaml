{{- if .Values.evalhub.url }}
---
# What each benchmark needs, recorded by scripts/evalhub/lighteval_compat.py inside the
# pinned adapter image (make evalhub-compat). The server reads it at request time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: amortized-evalhub-compat
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
    component: server
data:
  {{- (.Files.Glob "files/evalhub/compat/*.json").AsConfig | nindent 2 }}
{{- end }}
{{- if .Values.evalhub.operator.createInstance }}
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: EvalHub
metadata:
  name: {{ .Values.evalhub.operator.name }}
  namespace: {{ required "evalhub.operator.namespace is required" .Values.evalhub.operator.namespace }}
spec:
  replicas: 1
  database:
    type: postgresql
    secret: {{ required "evalhub.operator.databaseSecret with db-url is required" .Values.evalhub.operator.databaseSecret }}
  providers:
    - amortized
    - amortized-lighteval
  env:
    - name: MLFLOW_TRACKING_URI
      value: {{ include "amortized.mlflowTrackingUri" . | quote }}
    {{- if .Values.mlflow.enterprise.enabled }}
    - name: MLFLOW_TOKEN_PATH
      value: /var/run/secrets/kubernetes.io/serviceaccount/token
    - name: MLFLOW_WORKSPACE
      value: {{ .Values.jobsNamespace | quote }}
    {{- end }}
{{- end }}
{{- if .Values.evalhub.operator.createProviders }}
{{- $operatorNamespace := required "evalhub.operator.namespaceForProviders is required" .Values.evalhub.operator.namespaceForProviders }}
{{- $taskImage := required "Pin evalhub.operator.taskAdapterImage to a built image digest" .Values.evalhub.operator.taskAdapterImage }}
{{- if not (contains "@sha256:" $taskImage) }}
{{- fail "evalhub.operator.taskAdapterImage must use an immutable digest" }}
{{- end }}
{{- if not (contains "@sha256:" .Values.evalhub.operator.lightEvalImage) }}
{{- fail "evalhub.operator.lightEvalImage must use an immutable digest" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amortized-evalhub-task-provider
  namespace: {{ $operatorNamespace }}
  labels:
    trustyai.opendatahub.io/evalhub-provider-type: system
    trustyai.opendatahub.io/evalhub-provider-name: amortized
data:
  amortized.yaml: |
    id: amortized
    name: Amortized task evaluation v1
    description: Versioned deterministic, rubric and anchor/query task scoring
    runtime:
      k8s:
        image: {{ $taskImage | quote }}
        image_pull_policy: if_not_present
        entrypoint: [python, -m, amortized.evaluation.adapter]
        cpu_request: 1000m
        cpu_limit: 4000m
        memory_request: 2Gi
        memory_limit: 8Gi
    benchmarks:
      - id: task
        name: User-approved task recipe
        description: Dataset snapshot, scorer versions and optional approved-rubric judge
{{- /* The upstream Eval Hub catalog, vendored verbatim at a pinned commit. Only the
id and runtime are replaced, so the registered adapter is the pinned image. */}}
{{- $lighteval := .Files.Get "files/evalhub/lighteval.yaml" | fromYaml }}
{{- $_ := set $lighteval "id" "amortized-lighteval" }}
{{- $_ := set $lighteval "runtime" (dict "k8s" (dict
      "image" .Values.evalhub.operator.lightEvalImage
      "image_pull_policy" "if_not_present"
      "entrypoint" (list "python" "main.py")
      "cpu_request" "500m" "cpu_limit" "4000m"
      "memory_request" "4Gi" "memory_limit" "8Gi")) }}
{{- $compat := .Files.Get "files/evalhub/compat/amortized-lighteval.json" | fromJson }}
{{- if ne (get $compat "adapter_digest") (regexReplaceAll "^[^@]*@" .Values.evalhub.operator.lightEvalImage "") }}
{{- fail "files/evalhub/compat/amortized-lighteval.json describes a different adapter image than evalhub.operator.lightEvalImage; run make evalhub-compat" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amortized-evalhub-lighteval-provider
  namespace: {{ $operatorNamespace }}
  labels:
    trustyai.opendatahub.io/evalhub-provider-type: system
    trustyai.opendatahub.io/evalhub-provider-name: amortized-lighteval
data:
  amortized-lighteval.yaml: |
    {{- toYaml $lighteval | nindent 4 }}
{{- end }}
