apiVersion: v1
kind: Service
metadata:
  name: amortized-studio
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
    component: studio
spec:
  type: ClusterIP
  selector:
    app: amortized
    component: studio
  ports:
    - name: http
      port: 8080
      targetPort: http
