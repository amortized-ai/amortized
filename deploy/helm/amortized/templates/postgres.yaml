{{- if .Values.dataStores.bundled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
    component: postgres
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app: amortized
      component: postgres
  template:
    metadata:
      labels:
        app: amortized
        component: postgres
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "amortized.labels" . | nindent 10 }}
          component: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "amortized.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
    component: postgres
spec:
  type: ClusterIP
  selector:
    app: amortized
    component: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
{{- end }}
