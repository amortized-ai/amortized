apiVersion: v1
kind: Service
metadata:
  name: amortized-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
    component: server
spec:
  type: ClusterIP
  selector:
    app: amortized
    component: server
  ports:
    - name: http
      port: 8000
      targetPort: http
