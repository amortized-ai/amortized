{{- /*
Reproduces the base `morty-skills` configMapGenerator. The base flattens the
native skill tree into single-level keys using `__` as the path separator
(e.g. sdg-classification/SKILL.md -> sdg-classification__SKILL.md), because
ConfigMap keys may not contain `/`. The opencode Deployment mounts this ConfigMap
with items[].path mapping each key back to its nested path, rebuilding the tree
under .opencode/skills where opencode auto-discovers each skill.
*/ -}}
{{- if .Values.opencode.enabled }}
{{- $data := dict -}}
{{- range $path, $bytes := .Files.Glob "files/morty-skills/**" -}}
{{- $key := $path | trimPrefix "files/morty-skills/" | replace "/" "__" -}}
{{- $_ := set $data $key ($.Files.Get $path) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: morty-skills
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
data:
{{ toYaml $data | indent 2 }}
{{- end }}
