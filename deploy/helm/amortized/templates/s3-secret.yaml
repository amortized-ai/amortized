{{- /*
The server and MLflow read S3 credentials from the amortized-s3 secret via
envFrom, so it is created in both bundled and external modes. Jobs run in the
jobs namespace and need the same credentials (mirrors the dev overlay's
s3-secret-jobs.yaml).
*/ -}}
{{- $endpoint := include "amortized.s3Endpoint" . -}}
{{- $access := include "amortized.s3AccessKey" . -}}
{{- $secret := include "amortized.s3SecretKey" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: amortized-s3
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $access | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $secret | quote }}
  AWS_S3_ENDPOINT: {{ $endpoint | quote }}
  MLFLOW_S3_ENDPOINT_URL: {{ $endpoint | quote }}
  FSSPEC_S3_ENDPOINT_URL: {{ $endpoint | quote }}
  FSSPEC_S3_KEY: {{ $access | quote }}
  FSSPEC_S3_SECRET: {{ $secret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: amortized-s3
  namespace: {{ .Values.jobsNamespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $access | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $secret | quote }}
  AWS_S3_ENDPOINT: {{ $endpoint | quote }}
  MLFLOW_S3_ENDPOINT_URL: {{ $endpoint | quote }}
  FSSPEC_S3_ENDPOINT_URL: {{ $endpoint | quote }}
  FSSPEC_S3_KEY: {{ $access | quote }}
  FSSPEC_S3_SECRET: {{ $secret | quote }}
