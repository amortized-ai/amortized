{{- /*
Reproduces the base `morty-config` configMapGenerator. Keys are the file
basenames (morty.md, morty-identity.md, ...), matching the base ConfigMap and
the subPath mounts in the opencode deployment.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: morty-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
data:
{{- (.Files.Glob "files/morty-config/*").AsConfig | nindent 2 }}
