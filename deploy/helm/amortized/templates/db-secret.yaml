{{- /*
Database credentials in a Secret rather than the ConfigMap: AMORTIZED_DATABASE_URL
(which embeds the password) for the server, and POSTGRES_PASSWORD for the bundled
PostgreSQL StatefulSet. Created in both modes since the server always needs the URL.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: amortized-db
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
    component: server
type: Opaque
stringData:
  AMORTIZED_DATABASE_URL: {{ include "amortized.databaseUrl" . | quote }}
  {{- if .Values.dataStores.bundled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
