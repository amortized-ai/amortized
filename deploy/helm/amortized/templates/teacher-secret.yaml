{{- /*
Secret for inline SDG teacher-model provider keys (teacherKeys.values). Skipped
when an existing secret is referenced (teacherKeys.existingSecret) or nothing is set.
*/ -}}
{{- if and .Values.teacherKeys.values (not .Values.teacherKeys.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.teacherKeys.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.teacherKeys.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
