apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
    component: opencode
data:
  .opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": {{ .Values.model.opencodeModel | quote }},
      "mcp": {
        "amortized": {
          "type": "remote",
          "url": "http://{{ include "amortized.serverFqdn" . }}:8000/mcp",
          "enabled": true
        }
      },
      "agent": {
        "build": { "disable": true },
        "plan": { "disable": true }
      }
    }
