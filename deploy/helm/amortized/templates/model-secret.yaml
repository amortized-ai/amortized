{{- /*
Model-provider credentials, templated from values.

  model.provider = openai  -> Secret with OPENAI_API_KEY (unless an existing
                              secret is referenced via model.openai.existingSecret).
  model.provider = vertex  -> opencode-llm (project/location) and opencode-gcp
                              (ADC credentials.json) Secrets are created only when
                              their values are supplied; otherwise they are expected
                              to pre-exist in the namespace (mirrors the base, which
                              references but does not create them).
*/ -}}
{{- if eq .Values.model.provider "openai" }}
{{- if .Values.model.openai.existingSecret }}
{{- /* referencing a pre-existing secret; nothing to template */ -}}
{{- else if .Values.model.openai.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.model.openai.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
    component: opencode
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.model.openai.apiKey | quote }}
{{- else }}
{{- fail "model.provider=openai requires either model.openai.apiKey or model.openai.existingSecret" }}
{{- end }}
{{- else if eq .Values.model.provider "vertex" }}
{{- if and .Values.model.vertex.project .Values.model.vertex.location }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.model.vertex.llmSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
    component: opencode
type: Opaque
stringData:
  google-cloud-project: {{ .Values.model.vertex.project | quote }}
  vertex-location: {{ .Values.model.vertex.location | quote }}
{{- end }}
{{- with .Values.model.vertex.credentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.model.vertex.credentialsSecret }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "amortized.labels" $ | nindent 4 }}
    component: opencode
type: Opaque
stringData:
  credentials.json: |
{{ . | indent 4 }}
{{- end }}
{{- end }}
