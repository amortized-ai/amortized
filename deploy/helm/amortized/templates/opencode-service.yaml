apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "amortized.labels" . | nindent 4 }}
    component: opencode
spec:
  selector:
    app: amortized
    component: opencode
  ports:
    - name: http
      port: 4096
      targetPort: 4096
