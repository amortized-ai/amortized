<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="dot-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Amortization curve icon -->
  <g transform="translate(16, 16)">
    <!-- Descending curve: expensive → cheap -->
    <path d="M 8 12 C 20 12, 28 52, 72 58 L 72 72 L 8 72 Z" fill="url(#curve-grad)" opacity="0.15"/>
    <path d="M 8 12 C 20 12, 28 52, 72 58" stroke="url(#curve-grad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Axes -->
    <line x1="8" y1="8" x2="8" y2="76" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="72" x2="76" y2="72" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Start dot (expensive/big) -->
    <circle cx="8" cy="12" r="5" fill="#6366f1"/>
    <!-- End dot (cheap/small) -->
    <circle cx="72" cy="58" r="3.5" fill="#06b6d4"/>

    <!-- Step markers on curve -->
    <circle cx="24" cy="30" r="2" fill="url(#dot-grad)" opacity="0.5"/>
    <circle cx="40" cy="42" r="2" fill="url(#dot-grad)" opacity="0.5"/>
    <circle cx="56" cy="52" r="2" fill="url(#dot-grad)" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="108" y="73" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.5" fill="#0f172a">
    amortized
  </text>

  <!-- Tagline -->
  <text x="110" y="93" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" letter-spacing="3" fill="#64748b" text-transform="uppercase">
    TASK MODELS, FASTER
  </text>
</svg>