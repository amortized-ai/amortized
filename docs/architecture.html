<title>Amortized — Architecture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

<body>
<div class="container">
<h1>Amortized — Control Plane Architecture</h1>

<svg viewBox="0 0 920 780" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#484f58"/></marker>
  <marker id="ab" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#58a6ff"/></marker>
</defs>

<!-- ========== RUNNER (left) ========== -->
<rect x="20" y="20" width="200" height="740" rx="10" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="6 4"/>
<text x="120" y="44" text-anchor="middle" font-size="11" fill="#8b949e" font-weight="600" font-family="sans-serif">Runner</text>

<!-- CLI -->
<rect x="40" y="60" width="160" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="120" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3" font-family="sans-serif">CLI</text>
<text x="120" y="98" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">amortized submit / logs</text>

<!-- Recipe loader -->
<rect x="40" y="130" width="160" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="120" y="150" text-anchor="middle" font-size="10" fill="#c9d1d9" font-family="sans-serif">Recipe Loader</text>
<text x="120" y="164" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">YAML merge + overrides</text>

<!-- Artifact resolver -->
<rect x="40" y="195" width="160" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="120" y="215" text-anchor="middle" font-size="10" fill="#c9d1d9" font-family="sans-serif">Artifact Resolver</text>
<text x="120" y="229" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">artifact:&lt;id&gt; → remote path</text>

<!-- Config generators -->
<rect x="40" y="280" width="160" height="90" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="120" y="302" text-anchor="middle" font-size="11" font-weight="600" fill="#d29922" font-family="sans-serif">Config Generators</text>
<text x="120" y="320" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">_training_config_yaml()</text>
<text x="120" y="334" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">_serve_config_yaml()</text>
<text x="120" y="348" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">_sdg_script() · _eval_script()</text>
<text x="120" y="362" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">→ YAML or Python</text>

<!-- Worker loop -->
<rect x="40" y="400" width="160" height="70" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="120" y="422" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3" font-family="sans-serif">Worker Loop</text>
<text x="120" y="440" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">pick queued → dispatch</text>
<text x="120" y="454" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">poll status → register artifacts</text>

<!-- Serve monitor -->
<rect x="40" y="490" width="160" height="45" rx="6" fill="#161b22" stroke="#bc8cff"/>
<text x="120" y="510" text-anchor="middle" font-size="10" fill="#bc8cff" font-family="sans-serif">Serve Monitor</text>
<text x="120" y="524" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">background asyncio task</text>

<!-- Arrows within runner -->
<line x1="120" y1="110" x2="120" y2="130" stroke="#484f58" stroke-width="1" marker-end="url(#a)"/>
<line x1="120" y1="175" x2="120" y2="195" stroke="#484f58" stroke-width="1" marker-end="url(#a)"/>
<line x1="120" y1="240" x2="120" y2="280" stroke="#484f58" stroke-width="1" marker-end="url(#a)"/>
<line x1="120" y1="370" x2="120" y2="400" stroke="#484f58" stroke-width="1" marker-end="url(#a)"/>
<line x1="120" y1="470" x2="120" y2="490" stroke="#484f58" stroke-width="1" marker-end="url(#a)"/>

<!-- ========== CONTROL PLANE (center) ========== -->
<rect x="250" y="20" width="260" height="740" rx="10" fill="none" stroke="#1f3a5f" stroke-width="1" stroke-dasharray="6 4"/>
<text x="380" y="44" text-anchor="middle" font-size="11" fill="#58a6ff" font-weight="600" font-family="sans-serif">Control Plane (FastAPI)</text>

<!-- API -->
<rect x="270" y="60" width="220" height="80" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="380" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3" font-family="sans-serif">REST API</text>
<text x="380" y="100" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">/jobs · /artifacts · /events · /recipes</text>
<text x="380" y="114" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">/judge · /flows · /compute · /estimate</text>
<text x="380" y="128" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">/agent/chat · /mcp</text>

<!-- Job types -->
<rect x="270" y="160" width="220" height="60" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="380" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3" font-family="sans-serif">Job Types + Schemas</text>
<text x="380" y="200" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">training · sdg · eval · serve</text>
<text x="380" y="214" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">JSON Schema validation + semantic checks</text>

<!-- DB -->
<rect x="270" y="240" width="220" height="70" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="380" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3" font-family="sans-serif">SQLite</text>
<text x="380" y="280" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">jobs · artifacts · events · api_keys</text>
<text x="380" y="294" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">status: queued → running → succeeded</text>

<!-- Agent -->
<rect x="270" y="330" width="220" height="60" rx="6" fill="#161b22" stroke="#bc8cff"/>
<text x="380" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#bc8cff" font-family="sans-serif">AI Agent</text>
<text x="380" y="370" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">function-calling · guided workflow</text>
<text x="380" y="384" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">analyzes eval results · suggests next steps</text>

<!-- Judge templates -->
<rect x="270" y="410" width="220" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="380" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3" font-family="sans-serif">Judge Templates</text>
<text x="380" y="450" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">19 eval configs loaded from templates/eval/</text>

<!-- Credential mgmt -->
<rect x="270" y="480" width="220" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="380" y="502" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3" font-family="sans-serif">Credentials</text>
<text x="380" y="520" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">forward_env → podman secrets</text>

<!-- Arrows runner → control plane -->
<line x1="200" y1="85" x2="270" y2="85" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>
<line x1="200" y1="152" x2="270" y2="185" stroke="#484f58" stroke-width="1" marker-end="url(#a)"/>

<!-- ========== BACKEND (right) ========== -->
<rect x="540" y="20" width="360" height="740" rx="10" fill="none" stroke="#2d1f0e" stroke-width="1" stroke-dasharray="6 4"/>
<text x="720" y="44" text-anchor="middle" font-size="11" fill="#d29922" font-weight="600" font-family="sans-serif">Backend (SSH + podman)</text>

<!-- SSH Backend -->
<rect x="560" y="60" width="320" height="90" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="720" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#d29922" font-family="sans-serif">SSH Backend</text>
<text x="720" y="100" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">mkdir remote dir · write config.json</text>
<text x="720" y="114" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">write config.yaml / run.py · create podman secrets</text>
<text x="720" y="128" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">podman run -d --gpus all -p port:port {image} {cmd}</text>
<text x="720" y="142" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">--network host · -v mounts · --secret env vars</text>

<!-- Arrow: worker → backend -->
<line x1="200" y1="435" x2="260" y2="435" stroke="#484f58" stroke-width="1"/>
<line x1="260" y1="435" x2="540" y2="105" stroke="#d29922" stroke-width="1.5" marker-end="url(#a)"/>
<text x="370" y="260" font-size="9" fill="#d29922" font-family="sans-serif" transform="rotate(-30, 370, 260)">JobSpec (cmd, env, image, ports)</text>

<!-- Container: Training -->
<rect x="560" y="180" width="320" height="70" rx="6" fill="#1a1500" stroke="#d29922"/>
<text x="720" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#d29922" font-family="sans-serif">Training Container</text>
<text x="720" y="218" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">docker.io/huggingface/trl:1.5.0</text>
<text x="720" y="234" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">trl sft --config /amortized/work/config.yaml</text>
<text x="720" y="244" text-anchor="middle" font-size="8" fill="#d29922" font-family="sans-serif">→ adapter_model.safetensors + tokenizer</text>

<!-- Container: SDG -->
<rect x="560" y="270" width="320" height="70" rx="6" fill="#0d1926" stroke="#3fb950"/>
<text x="720" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950" font-family="sans-serif">SDG Container</text>
<text x="720" y="308" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">ghcr.io/amortized-ai/asynth</text>
<text x="720" y="324" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">python /amortized/work/run.py (synthesize)</text>
<text x="720" y="334" text-anchor="middle" font-size="8" fill="#3fb950" font-family="sans-serif">→ generated_data.jsonl</text>

<!-- Container: Serve -->
<rect x="560" y="360" width="320" height="70" rx="6" fill="#1a0d26" stroke="#bc8cff"/>
<text x="720" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#bc8cff" font-family="sans-serif">Serve Container (long-running)</text>
<text x="720" y="398" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">docker.io/vllm/vllm-openai</text>
<text x="720" y="414" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">vllm serve --config /amortized/work/config.yaml</text>
<text x="720" y="424" text-anchor="middle" font-size="8" fill="#bc8cff" font-family="sans-serif">→ OpenAI-compatible /v1/chat/completions</text>

<!-- Container: Eval -->
<rect x="560" y="450" width="320" height="70" rx="6" fill="#0d1926" stroke="#3fb950"/>
<text x="720" y="472" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950" font-family="sans-serif">Eval Container</text>
<text x="720" y="488" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">ghcr.io/amortized-ai/asynth</text>
<text x="720" y="504" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">python /amortized/work/run.py (infer + judge)</text>
<text x="720" y="514" text-anchor="middle" font-size="8" fill="#3fb950" font-family="sans-serif">→ eval_results.json (accuracy + judge scores)</text>

<!-- Arrow: Eval → Serve (API call) -->
<path d="M 560 490 Q 540 430, 560 410" stroke="#bc8cff" stroke-width="1" fill="none" marker-end="url(#a)" stroke-dasharray="3 2"/>
<text x="532" y="450" font-size="8" fill="#bc8cff" font-family="sans-serif">API</text>

<!-- Post-completion flow -->
<rect x="560" y="550" width="320" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="720" y="572" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3" font-family="sans-serif">Post-Completion</text>
<text x="720" y="590" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">SFTP download outputs → local output dir</text>
<text x="720" y="604" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">Register artifacts (model = directory artifact)</text>
<text x="720" y="618" text-anchor="middle" font-size="9" fill="#8b949e" font-family="sans-serif">Cleanup podman secrets</text>

<!-- Arrow: backend → post-completion -->
<line x1="720" y1="520" x2="720" y2="550" stroke="#484f58" stroke-width="1" marker-end="url(#a)"/>

<!-- Arrow: post-completion → DB -->
<path d="M 560 610 Q 380 660, 380 540" stroke="#484f58" stroke-width="1" fill="none" marker-end="url(#a)"/>
<text x="440" y="620" font-size="8" fill="#8b949e" font-family="sans-serif">update job status + artifacts</text>

<!-- Remote dir -->
<rect x="560" y="660" width="320" height="70" rx="6" fill="#0d1117" stroke="#21262d"/>
<text x="720" y="682" text-anchor="middle" font-size="11" font-weight="600" fill="#8b949e" font-family="sans-serif">Remote Job Directory</text>
<text x="720" y="700" text-anchor="middle" font-size="9" fill="#484f58" font-family="sans-serif">~/amortized-jobs/{job-id}/</text>
<text x="720" y="714" text-anchor="middle" font-size="9" fill="#484f58" font-family="sans-serif">config.json · config.yaml / run.py · outputs</text>
<text x="720" y="728" text-anchor="middle" font-size="9" fill="#484f58" font-family="sans-serif">mounted at /amortized/work inside containers</text>

</svg>

</div>
