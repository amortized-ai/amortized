type: sdg
description: Generate question-answer pairs using a teacher model
config:
  num_samples: 50
  max_concurrency: 10
  temperature: 0.7
  strategy_params:
    generated_attributes:
      - id: question
        instruction_messages:
          - role: user
            content: "Generate a diverse, interesting question about a random topic. Just output the question, nothing else."
      - id: answer
        instruction_messages:
          - role: user
            content: "Answer this question thoroughly and accurately: {question}"
    passthrough_attributes:
      - question
      - answer
