type: sdg
description: Generate question-answer pairs with few-shot examples across difficulty levels and topics
config:
  model: openai/gpt-4o-mini
  num_samples: 50
  temperature: 0.7
  max_tokens: 1024
  max_concurrency: 10
  strategy_params:
    input_examples:
      - examples:
        - example_question: "What is Newton's third law of motion?"
          example_answer: "Newton's third law states that for every action, there is an equal and opposite reaction. This means that when one object exerts a force on a second object, the second object simultaneously exerts a force equal in magnitude but opposite in direction on the first object."
          example_difficulty: "Simple factual questions"
          example_topic: "Questions about physics, chemistry, biology"
        - example_question: "How did the invention of the printing press transform European society?"
          example_answer: "The printing press, invented by Johannes Gutenberg around 1440, revolutionized European society by making books affordable and widely available. It accelerated the spread of literacy, enabled the rapid dissemination of scientific and philosophical ideas, fueled the Protestant Reformation by making the Bible accessible in vernacular languages, and laid the groundwork for the Renaissance and the Scientific Revolution."
          example_difficulty: "Requires reasoning and connecting multiple concepts"
          example_topic: "Questions about historical events and figures"
        - example_question: "Explain how transformer architectures handle long-range dependencies differently from RNNs, and what trade-offs this introduces in terms of computational complexity."
          example_answer: "Transformers use self-attention mechanisms that compute pairwise relationships between all positions in a sequence simultaneously, giving them O(1) path length for any dependency regardless of distance. RNNs process sequences step-by-step, requiring O(n) steps for a dependency spanning n positions, which causes gradient vanishing/exploding. However, self-attention has O(n²) computational and memory complexity per layer, compared to O(n) for RNNs. This makes transformers more powerful for capturing long-range patterns but more expensive for very long sequences, motivating approaches like sparse attention and linear attention variants."
          example_difficulty: "Complex multi-step reasoning requiring deep knowledge"
          example_topic: "Questions about computing, engineering, AI"

    sampled_attributes:
      - id: difficulty
        name: Difficulty Level
        description: How challenging the question should be
        possible_values:
          - id: easy
            name: Easy
            description: Simple factual questions
            sample_rate: 0.3
          - id: medium
            name: Medium
            description: Requires reasoning and connecting multiple concepts
            sample_rate: 0.5
          - id: hard
            name: Hard
            description: Complex multi-step reasoning requiring deep knowledge
            sample_rate: 0.2

      - id: topic
        name: Topic
        description: Subject area for the question
        possible_values:
          - id: science
            name: Science
            description: Physics, chemistry, biology
          - id: history
            name: History
            description: Historical events and figures
          - id: technology
            name: Technology
            description: Computing, engineering, AI

    generated_attributes:
      - id: question
        instruction_messages:
          - role: system
            content: |
              You are an expert educator creating quiz questions across different subjects.

              Create questions that are:
              - Clear and unambiguous
              - Factually accurate
              - Appropriate for the specified difficulty level
              - Focused on the specified topic area

              Format your question as follows:
              Question:
              <question>
              End Question

              Write only the question, do not include the answer.
          - role: user
            content: |
              Difficulty: {example_difficulty}
              Topic: {example_topic}
          - role: assistant
            content: |
              Question:
              {example_question}
              End Question
          - role: user
            content: |
              Difficulty: {difficulty.description}
              Topic: {topic.description}
        postprocessing_params:
          id: cleaned_question
          cut_prefix: "Question:"
          cut_suffix: "End Question"
          strip_whitespace: true

      - id: answer
        instruction_messages:
          - role: system
            content: |
              You are a knowledgeable expert providing accurate, informative answers.

              Provide answers that are:
              - Factually correct
              - Complete but concise
              - Educational and informative

              Format your answer as follows:
              Answer:
              <answer>
              End Answer

              Write only the answer, do not include additional filler text.
          - role: user
            content: |
              {example_question}
          - role: assistant
            content: |
              Answer:
              {example_answer}
              End Answer
          - role: user
            content: |
              {cleaned_question}
        postprocessing_params:
          id: cleaned_answer
          cut_prefix: "Answer:"
          cut_suffix: "End Answer"
          strip_whitespace: true

    transformed_attributes:
      - id: conversation
        transformation_strategy:
          type: chat
          chat_transform:
            messages:
              - role: user
                content: "{cleaned_question}"
              - role: assistant
                content: "{cleaned_answer}"

    passthrough_attributes:
      - conversation
      - cleaned_question
      - cleaned_answer
      - difficulty
      - topic
