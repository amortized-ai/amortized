apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: amortized-dev
  labels:
    app: amortized
    component: opencode
data:
  .opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "google-vertex-anthropic/claude-opus-4-6@default",
      "mcp": {
        "amortized": {
          "type": "remote",
          "url": "http://amortized-server.amortized-dev.svc.cluster.local:8000/mcp",
          "enabled": true
        }
      },
      "agent": {
        "build": { "disable": true },
        "plan": { "disable": true }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: amortized-dev
  labels:
    app: amortized
    component: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: opencode
  template:
    metadata:
      labels:
        app: amortized
        component: opencode
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: opencode
          image: ghcr.io/anomalyco/opencode:latest
          imagePullPolicy: IfNotPresent
          command: ["opencode", "serve", "--port", "4096", "--hostname", "0.0.0.0"]
          workingDir: /app/workspace
          ports:
            - name: http
              containerPort: 4096
          env:
            - name: HOME
              value: /tmp
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: opencode-llm
                  key: google-cloud-project
            - name: VERTEX_LOCATION
              valueFrom:
                secretKeyRef:
                  name: opencode-llm
                  key: vertex-location
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /app/gcp/credentials.json
          volumeMounts:
            - name: opencode-config
              mountPath: /app/workspace/opencode.json
              subPath: .opencode.json
              readOnly: true
            - name: morty-prompt
              mountPath: /app/workspace/.opencode/agents/morty.md
              subPath: morty.md
              readOnly: true
            - name: gcp-credentials
              mountPath: /app/gcp
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: opencode-config
          configMap:
            name: opencode-config
        - name: morty-prompt
          configMap:
            name: morty-config
        - name: gcp-credentials
          secret:
            secretName: opencode-gcp
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: amortized-dev
  labels:
    app: amortized
    component: opencode
spec:
  selector:
    app: amortized
    component: opencode
  ports:
    - name: http
      port: 4096
      targetPort: 4096
