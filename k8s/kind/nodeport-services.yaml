apiVersion: v1
kind: Service
metadata:
  name: amortized-studio-nodeport
  namespace: amortized
  labels:
    app: amortized
    component: studio
spec:
  type: NodePort
  selector:
    app: amortized
    component: studio
  ports:
    - port: 8080
      targetPort: http
      nodePort: 31080
---
apiVersion: v1
kind: Service
metadata:
  name: amortized-server-nodeport
  namespace: amortized
  labels:
    app: amortized
    component: server
spec:
  type: NodePort
  selector:
    app: amortized
    component: server
  ports:
    - port: 8000
      targetPort: http
      nodePort: 31081
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-nodeport
  namespace: amortized
  labels:
    app: amortized
    component: mlflow
spec:
  type: NodePort
  selector:
    app: amortized
    component: mlflow
  ports:
    - port: 5000
      targetPort: http
      nodePort: 31082
