apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: amortized
  labels:
    app: amortized
    component: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: opencode
  template:
    metadata:
      labels:
        app: amortized
        component: opencode
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: build-skills-tree
          image: busybox:1.37
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c"]
          # Expand the flat ConfigMap keys (name__with__underscores) into a
          # nested skill tree (name/with/underscores) that opencode discovers
          # at .opencode/skills/<skill>/SKILL.md.
          args:
            - |
              set -e
              cd /flat
              for f in *; do
                [ "$f" = "*" ] && continue
                dir="/skills/$(echo "$f" | sed 's|__|/|g' | xargs dirname)"
                name="$(echo "$f" | sed 's|__|/|g' | xargs basename)"
                mkdir -p "$dir"
                cp "$f" "$dir/$name"
              done
          volumeMounts:
            - name: morty-skills
              mountPath: /flat
              readOnly: true
            - name: skills-tree
              mountPath: /skills
      containers:
        - name: opencode
          image: ghcr.io/anomalyco/opencode:latest
          imagePullPolicy: Always
          command: ["opencode", "serve", "--port", "4096", "--hostname", "0.0.0.0"]
          workingDir: /app/workspace
          ports:
            - name: http
              containerPort: 4096
          env:
            - name: HOME
              value: /tmp
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: opencode-llm
                  key: google-cloud-project
            - name: VERTEX_LOCATION
              valueFrom:
                secretKeyRef:
                  name: opencode-llm
                  key: vertex-location
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /app/gcp/credentials.json
            # GLM (RITS) provider — optional. When the opencode-glm secret is absent
            # (or its keys empty) these resolve to nothing and Morty stays on the Opus
            # default. The RITS host is only reachable via the team CONNECT proxy, so
            # HTTPS_PROXY routes opencode's (Bun) fetch through it while NO_PROXY keeps
            # the in-cluster MCP + service traffic direct. Create the secret out-of-band
            # (see amortized-kind-deploy k8s/base-internal/opencode-secret.yaml).
            - name: GLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: opencode-glm
                  key: base-url
                  optional: true
            - name: GLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-glm
                  key: api-key
                  optional: true
            - name: HTTPS_PROXY
              valueFrom:
                secretKeyRef:
                  name: opencode-glm
                  key: https-proxy
                  optional: true
            - name: HTTP_PROXY
              valueFrom:
                secretKeyRef:
                  name: opencode-glm
                  key: https-proxy
                  optional: true
            - name: NO_PROXY
              value: "localhost,127.0.0.1,::1,.svc,.svc.cluster.local,.cluster.local"
          volumeMounts:
            - name: opencode-config
              mountPath: /app/workspace/opencode.json
              subPath: .opencode.json
              readOnly: true
            - name: morty-prompt
              mountPath: /app/workspace/.opencode/agents/morty.md
              subPath: morty.md
              readOnly: true
            - name: morty-prompt
              mountPath: /app/workspace/.opencode/agents/sdg.md
              subPath: morty-sdg-workflow.md
              readOnly: true
            - name: morty-prompt
              mountPath: /app/workspace/.opencode/agents/training.md
              subPath: morty-training-workflow.md
              readOnly: true
            - name: morty-prompt
              mountPath: /app/workspace/.opencode/agents/eval.md
              subPath: morty-eval-workflow.md
              readOnly: true
            - name: skills-tree
              mountPath: /app/workspace/.opencode/skills
              readOnly: true
            - name: gcp-credentials
              mountPath: /app/gcp
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: opencode-config
          configMap:
            name: opencode-config
        - name: morty-prompt
          configMap:
            name: morty-config
        - name: morty-skills
          configMap:
            name: morty-skills
        - name: skills-tree
          emptyDir: {}
        - name: gcp-credentials
          secret:
            secretName: opencode-gcp
