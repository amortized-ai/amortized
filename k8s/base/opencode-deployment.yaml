apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: amortized
  labels:
    app: amortized
    component: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: opencode
  template:
    metadata:
      labels:
        app: amortized
        component: opencode
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: opencode
          image: ghcr.io/anomalyco/opencode:latest
          imagePullPolicy: Always
          command: ["opencode", "serve", "--port", "4096", "--hostname", "0.0.0.0"]
          workingDir: /app/workspace
          ports:
            - name: http
              containerPort: 4096
          env:
            - name: HOME
              value: /tmp
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: opencode-llm
                  key: google-cloud-project
            - name: VERTEX_LOCATION
              valueFrom:
                secretKeyRef:
                  name: opencode-llm
                  key: vertex-location
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /app/gcp/credentials.json
          volumeMounts:
            - name: opencode-config
              mountPath: /app/workspace/.opencode.json
              subPath: .opencode.json
              readOnly: true
            - name: opencode-config
              mountPath: /app/workspace/.opencode/agents/morty.md
              subPath: morty.md
              readOnly: true
            - name: gcp-credentials
              mountPath: /app/gcp
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: opencode-config
          configMap:
            name: opencode-config
        - name: gcp-credentials
          secret:
            secretName: opencode-gcp
