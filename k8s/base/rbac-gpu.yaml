# RBAC for GPU utilization monitoring — allows the amortized-server service
# account to list nodes (cluster-wide) and exec into the nvidia device plugin
# pod in kube-system to run nvidia-smi.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amortized-node-reader
  labels:
    app: amortized
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amortized-node-reader
  labels:
    app: amortized
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amortized-node-reader
subjects:
  - kind: ServiceAccount
    name: amortized-server
    namespace: amortized
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amortized-gpu-reader
  namespace: kube-system
  labels:
    app: amortized
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amortized-gpu-reader
  namespace: kube-system
  labels:
    app: amortized
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amortized-gpu-reader
subjects:
  - kind: ServiceAccount
    name: amortized-server
    namespace: amortized
