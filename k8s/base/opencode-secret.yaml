apiVersion: v1
kind: Secret
metadata:
  name: opencode-llm
  namespace: amortized
  labels:
    app: amortized
    component: opencode
type: Opaque
stringData:
  google-cloud-project: "REPLACE_WITH_GCP_PROJECT_ID"
  vertex-location: "us-east5"
---
# GCP service account credentials for Vertex AI
# Create this secret separately:
#   oc create secret generic opencode-gcp \
#     --from-file=credentials.json=/path/to/service-account.json \
#     -n amortized
