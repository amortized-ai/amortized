# Only the server may call the model-check service. The service sends requests to
# caller-supplied URLs with caller-supplied keys, so ClusterIP reachability alone is not
# enough. The server shares this namespace, so a podSelector alone admits it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amortized-model-check
  namespace: amortized
  labels:
    app: amortized
    component: model-check
spec:
  podSelector:
    matchLabels:
      app: amortized
      component: model-check
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: amortized
              component: server
      ports:
        - protocol: TCP
          port: 7351
