apiVersion: apps/v1
kind: Deployment
metadata:
  name: amortized-server
  namespace: amortized
  labels:
    app: amortized
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: amortized
        component: server
    spec:
      serviceAccountName: amortized-server
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-db
          image: docker.io/library/postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          env:
            - name: PGHOST
              value: "postgres.amortized.svc.cluster.local"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "amortized"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: server
          image: ghcr.io/amortized-ai/amortized:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: amortized-config
            - secretRef:
                name: amortized-s3
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: amortized-server-data
