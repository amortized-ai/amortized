apiVersion: apps/v1
kind: Deployment
metadata:
  name: amortized-server
  namespace: amortized
  labels:
    app: amortized
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: amortized
        component: server
    spec:
      serviceAccountName: amortized-server
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: migrate
          image: ghcr.io/amortized-ai/amortized:latest
          command: ["sh", "-c"]
          args:
            - |
              cd /app &&
              python -c "
              import asyncio, asyncpg, os
              async def check():
                  conn = await asyncpg.connect(os.environ['AMORTIZED_DATABASE_URL'])
                  has_jobs = await conn.fetchrow(\"SELECT 1 FROM information_schema.tables WHERE table_name='jobs'\")
                  has_alembic = await conn.fetchrow(\"SELECT 1 FROM information_schema.tables WHERE table_name='alembic_version'\")
                  await conn.close()
                  return bool(has_jobs and not has_alembic)
              if asyncio.run(check()): print('Stamping existing schema'); exit(0)
              exit(1)
              " 2>/dev/null && alembic stamp head;
              alembic upgrade head
          envFrom:
            - configMapRef:
                name: amortized-config
            - secretRef:
                name: amortized-s3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: server
          image: ghcr.io/amortized-ai/amortized:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: amortized-config
            - secretRef:
                name: amortized-s3
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: amortized-server-data
