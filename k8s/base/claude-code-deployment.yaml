apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-code
  namespace: amortized
  labels:
    app: amortized
    component: claude-code
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: claude-code
  template:
    metadata:
      labels:
        app: amortized
        component: claude-code
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: claude-code
          image: ghcr.io/amortized-ai/claude-code-agent:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4096
          env:
            - name: CLAUDE_CODE_USE_VERTEX
              value: "1"
            - name: ANTHROPIC_VERTEX_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: opencode-llm
                  key: google-cloud-project
            - name: CLOUD_ML_REGION
              valueFrom:
                secretKeyRef:
                  name: opencode-llm
                  key: vertex-location
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /app/gcp/credentials.json
            - name: ANTHROPIC_MODEL
              value: "claude-opus-4-8"
            - name: MCP_AMORTIZED_URL
              value: "http://amortized-server.amortized.svc.cluster.local:8000/mcp"
            - name: MCP_MLFLOW_URL
              value: "http://127.0.0.1:5002/sse"
          volumeMounts:
            - name: morty-prompt
              mountPath: /app/morty.md
              subPath: morty.md
              readOnly: true
            - name: gcp-credentials
              mountPath: /app/gcp
              readOnly: true
            - name: session-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: morty-prompt
          configMap:
            name: morty-config
        - name: gcp-credentials
          secret:
            secretName: opencode-gcp
        - name: session-data
          emptyDir: {}
