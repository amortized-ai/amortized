apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - server-pvc.yaml
  - server-deployment.yaml
  - server-service.yaml
  - studio-deployment.yaml
  - studio-service.yaml
  - opencode-configmap.yaml
  - opencode-deployment.yaml
  - opencode-service.yaml

configMapGenerator:
  - name: morty-config
    namespace: amortized
    files:
      - morty.md=morty-prompt.md
      - morty-identity.md=morty-identity.md
      - morty-workflow.md=morty-workflow.md
      - morty-sdg-workflow.md=morty-sdg-workflow.md
      - morty-training-workflow.md=morty-training-workflow.md
      - morty-eval-workflow.md=morty-eval-workflow.md
    options:
      disableNameSuffixHash: true
  # Native opencode skills. The build-skills-tree init container expands the
  # flat keys (name__file -> name/file) into .opencode/skills/<skill>/SKILL.md,
  # which opencode auto-discovers. Each skill dir name == its frontmatter name.
  # NOTE: files are listed explicitly here (the Helm chart globs them instead),
  # so a new skill won't ship via kustomize unless it is also added below.
  - name: morty-skills
    namespace: amortized
    files:
      - sdg-classification__SKILL.md=morty-skills/sdg-classification/SKILL.md
      - sdg-knowledge-ingestion__SKILL.md=morty-skills/sdg-knowledge-ingestion/SKILL.md
      - sdg-task-distillation__SKILL.md=morty-skills/sdg-task-distillation/SKILL.md
      - training-knowledge-ingestion-osft__SKILL.md=morty-skills/training-knowledge-ingestion-osft/SKILL.md
      - training-knowledge-ingestion-osft__training-config-template.json=morty-skills/training-knowledge-ingestion-osft/training-config-template.json
      - training-knowledge-ingestion-osft__supported_models.json=morty-skills/training-knowledge-ingestion-osft/supported_models.json
    options:
      disableNameSuffixHash: true
