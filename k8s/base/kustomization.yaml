apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - server-pvc.yaml
  - server-deployment.yaml
  - server-service.yaml
  - studio-deployment.yaml
  - studio-service.yaml
  - opencode-configmap.yaml
  - opencode-deployment.yaml
  - opencode-service.yaml

configMapGenerator:
  - name: morty-config
    namespace: amortized
    files:
      - morty.md=morty-prompt.md
      - morty-identity.md=morty-identity.md
      - morty-workflow.md=morty-workflow.md
      - morty-sdg-workflow.md=morty-sdg-workflow.md
      - morty-training-workflow.md=morty-training-workflow.md
    options:
      disableNameSuffixHash: true
  - name: morty-skills
    namespace: amortized
    files:
      - sdg__guidance.md=morty-skills/sdg/guidance.md
      - sdg__classification__guide.md=morty-skills/sdg/classification/guide.md
      - sdg__knowledge-ingestion__guide.md=morty-skills/sdg/knowledge-ingestion/guide.md
      - sdg__knowledge-ingestion__reference-payload.json=morty-skills/sdg/knowledge-ingestion/reference-payload.json
      - sdg__task-distillation__reference-payload.json=morty-skills/sdg/task-distillation/reference-payload.json
      - training__guidance.md=morty-skills/training/guidance.md
      - training__knowledge-ingestion__osft__guide.md=morty-skills/training/knowledge-ingestion/osft/guide.md
      - training__knowledge-ingestion__osft__reference-payload.json=morty-skills/training/knowledge-ingestion/osft/reference-payload.json
      - training__knowledge-ingestion__osft__training-config-template.json=morty-skills/training/knowledge-ingestion/osft/training-config-template.json
      - training__supported_models.json=morty-skills/training/supported_models.json
    options:
      disableNameSuffixHash: true
