apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - server-pvc.yaml
  - server-deployment.yaml
  - server-service.yaml
  - studio-deployment.yaml
  - studio-service.yaml
  - opencode-configmap.yaml
  - opencode-deployment.yaml
  - opencode-service.yaml
  - claude-code-deployment.yaml
  - claude-code-service.yaml

configMapGenerator:
  - name: morty-config
    namespace: amortized
    files:
      - morty.md=morty-prompt.md
    options:
      disableNameSuffixHash: true
  - name: morty-skills
    namespace: amortized
    files:
      - sdg__guidance.md=morty-skills/sdg/guidance.md
      - sdg__classification__guide.md=morty-skills/sdg/classification/guide.md
      - sdg__extraction__guide.md=morty-skills/sdg/extraction/guide.md
      - sdg__summarization__guide.md=morty-skills/sdg/summarization/guide.md
      - sdg__knowledge-ingestion__guide.md=morty-skills/sdg/knowledge-ingestion/guide.md
      - sdg__knowledge-ingestion__sdg-recipe-template.json=morty-skills/sdg/knowledge-ingestion/sdg-recipe-template.json
      - training__guidance.md=morty-skills/training/guidance.md
      - training__osft__guide.md=morty-skills/training/osft/guide.md
      - training__osft__training-config-template.json=morty-skills/training/osft/training-config-template.json
      - training__lora-sft__guide.md=morty-skills/training/lora-sft/guide.md
      - training__qlora__guide.md=morty-skills/training/qlora/guide.md
      - eval__guidance.md=morty-skills/eval/guidance.md
      - eval__llm-judge__guide.md=morty-skills/eval/llm-judge/guide.md
    options:
      disableNameSuffixHash: true
