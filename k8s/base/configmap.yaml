apiVersion: v1
kind: ConfigMap
metadata:
  name: amortized-config
  namespace: amortized
  labels:
    app: amortized
    component: server
data:
  AMORTIZED_DB_PATH: "/data/amortized.db"
  AMORTIZED_DATA_DIR: "/data"
  AMORTIZED_COMPUTE_BACKEND: "kubernetes"
  AMORTIZED_COMPUTE_NAMESPACE: "amortized-jobs"
  AMORTIZED_IMAGE_REGISTRY: "ghcr.io/amortized-ai"
  AMORTIZED_EXTERNAL_URL: "http://amortized-server.amortized.svc.cluster.local:8000"
  # Platform engineer: set these to your MLflow and S3 endpoints
  AMORTIZED_MLFLOW_TRACKING_URI: ""
  AMORTIZED_GATEWAY_URL: ""
  AMORTIZED_S3_BUCKET: ""
  AMORTIZED_DOCLING_URL: ""
