apiVersion: apps/v1
kind: Deployment
metadata:
  name: amortized-studio
  namespace: amortized
  labels:
    app: amortized
    component: studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: studio
  template:
    metadata:
      labels:
        app: amortized
        component: studio
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: studio
          image: ghcr.io/amortized-ai/studio:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: "amortized-server"
            - name: BACKEND_PORT
              value: "8000"
            # Agent backend — switch by changing AGENT_HOST:
            #   opencode:    AGENT_HOST=opencode
            #   claude-code: AGENT_HOST=claude-code
            - name: AGENT_HOST
              value: "opencode"
            - name: AGENT_PORT
              value: "4096"
            - name: MLFLOW_HOST
              value: "mlflow.amortized.svc.cluster.local"
            - name: MLFLOW_PORT
              value: "5000"
            - name: DNS_RESOLVER
              value: "10.96.0.10"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
