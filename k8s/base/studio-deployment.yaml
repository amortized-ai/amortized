apiVersion: apps/v1
kind: Deployment
metadata:
  name: amortized-studio
  namespace: amortized
  labels:
    app: amortized
    component: studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: studio
  template:
    metadata:
      labels:
        app: amortized
        component: studio
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: studio
          image: ghcr.io/amortized-ai/studio:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: "amortized-server"
            - name: BACKEND_PORT
              value: "8000"
            - name: OPENCODE_HOST
              value: "opencode"
            - name: OPENCODE_PORT
              value: "4096"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
