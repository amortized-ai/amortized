apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: amortized
  labels:
    app: amortized
    component: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: mlflow
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: amortized
        component: mlflow
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:latest
          command:
            - "mlflow"
            - "server"
            - "--backend-store-uri"
            - "sqlite:///mlflow/mlflow.db"
            - "--default-artifact-root"
            - "s3://amortized/mlflow/"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "5000"
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: amortized-s3
          volumeMounts:
            - name: data
              mountPath: /mlflow
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
