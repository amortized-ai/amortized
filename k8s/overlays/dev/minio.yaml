apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: amortized
  labels:
    app: amortized
    component: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: amortized
        component: minio
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin"
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: amortized
  labels:
    app: amortized
    component: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: amortized
  labels:
    app: amortized
    component: minio
spec:
  type: ClusterIP
  selector:
    app: amortized
    component: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
