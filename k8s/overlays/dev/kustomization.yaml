apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Dev-only: bundled MinIO + MLflow (production brings their own)
  - ../../services
  - s3-secret-jobs.yaml
  # Dev-only: OpenAI-based OpenCode config (production uses Vertex AI)

patches:
  # Set MLflow URI and S3 bucket for dev
  - target:
      kind: ConfigMap
      name: amortized-config
    patch: |
      - op: replace
        path: /data/AMORTIZED_MLFLOW_TRACKING_URI
        value: "http://mlflow.amortized.svc.cluster.local:5000"
      - op: replace
        path: /data/AMORTIZED_GATEWAY_URL
        value: "http://mlflow.amortized.svc.cluster.local:5000/gateway/mlflow/v1"
      - op: replace
        path: /data/AMORTIZED_S3_BUCKET
        value: "amortized"
      - op: replace
        path: /data/AMORTIZED_DOCLING_URL
        value: "http://docling-serve.amortized.svc.cluster.local:5001"
      - op: replace
        path: /data/AMORTIZED_DATABASE_URL
        value: "postgresql://amortized:amortized@postgres.amortized.svc.cluster.local:5432/amortized"
  # Dev: IfNotPresent for kind, relax security for images that run as root
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/securityContext/runAsNonRoot
        value: false
