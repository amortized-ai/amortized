apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-serve
  namespace: amortized
  labels:
    app: amortized
    component: docling-serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: docling-serve
  template:
    metadata:
      labels:
        app: amortized
        component: docling-serve
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: docling-serve
          image: ghcr.io/docling-project/docling-serve:latest
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: DOCLING_SERVE_ENABLE_UI
              value: "1"
            - name: DOCLING_SERVE_MAX_SYNC_WAIT
              value: "600"
          resources:
            requests:
              memory: "4Gi"
            limits:
              memory: "32Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
        - name: chonkie-serve
          image: chonkie-serve:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: chonkie
              containerPort: 8900
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: chonkie
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: chonkie
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: docling-serve
  namespace: amortized
  labels:
    app: amortized
    component: docling-serve
spec:
  type: ClusterIP
  selector:
    app: amortized
    component: docling-serve
  ports:
    - name: http
      port: 5001
      targetPort: http
    - name: chonkie
      port: 8900
      targetPort: chonkie
