apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: amortized
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://minio:9000/minio/health/live; do sleep 2; done']
      containers:
        - name: create-bucket
          image: docker.io/amazon/aws-cli:latest
          command:
            - sh
            - -c
            - |
              aws --endpoint-url http://minio:9000 s3 mb s3://amortized --region us-east-1 || true
              aws --endpoint-url http://minio:9000 s3 ls
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "minioadmin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "minioadmin"
