# Placeholder S3 credentials so the server's envFrom resolves and it can boot.
# Points at an in-namespace MinIO that is deployed in a later phase; S3-backed
# features stay inert until then, but startup does not depend on it.
apiVersion: v1
kind: Secret
metadata:
  name: amortized-s3
  labels:
    app: amortized
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
  AWS_S3_ENDPOINT: "http://minio:9000"
  MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
  FSSPEC_S3_ENDPOINT_URL: "http://minio:9000"
  FSSPEC_S3_KEY: "minioadmin"
  FSSPEC_S3_SECRET: "minioadmin"
