# Runs alembic migrations against Postgres before the server starts.
# init_db() only opens the pool; it does not create the schema, and the
# server lifespan queries the jobs table on boot — so the schema must exist first.
apiVersion: batch/v1
kind: Job
metadata:
  name: amortized-migrate
  labels:
    app: amortized
    component: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: amortized
        component: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: quay.io/sclorg/postgresql-16-c9s:latest
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -p 5432 -U amortized; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: migrate
          image: ghcr.io/amortized-ai/amortized:latest
          command: ["sh", "-c", "cd /app && alembic upgrade head"]
          envFrom:
            - configMapRef:
                name: amortized-config
            - secretRef:
                name: amortized-s3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
