apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Experimental OpenShift bring-up of the amortized control plane
# (server + studio + Postgres) for the RHOAI community-plugin exploration.
# Deployed into a single namespace; MLflow / MinIO / OpenCode (Morty) and
# GPU jobs are layered on in later phases.
namespace: meyceoz-amortized

resources:
  - amortized-config.yaml
  - s3-secret.yaml
  - postgres.yaml
  - server.yaml
  - studio.yaml
  - migrate-job.yaml
