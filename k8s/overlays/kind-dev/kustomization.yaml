apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: amortized-dev

resources:
  - ../../base

patches:
  # Populate configmap with dev values
  - target:
      kind: ConfigMap
      name: amortized-config
    patch: |
      - op: replace
        path: /data/AMORTIZED_COMPUTE_NAMESPACE
        value: "amortized-dev-jobs"
      - op: add
        path: /data/AMORTIZED_IMAGE_PULL_POLICY
        value: "IfNotPresent"
      - op: replace
        path: /data/AMORTIZED_EXTERNAL_URL
        value: "http://amortized-server.amortized-dev.svc.cluster.local:8000"
      - op: replace
        path: /data/AMORTIZED_MLFLOW_TRACKING_URI
        value: "http://mlflow.amortized.svc.cluster.local:5000"
      - op: replace
        path: /data/AMORTIZED_GATEWAY_URL
        value: "http://mlflow.amortized.svc.cluster.local:5000/gateway/mlflow/v1"
      - op: replace
        path: /data/AMORTIZED_S3_BUCKET
        value: "amortized"

  # imagePullPolicy: IfNotPresent for kind (images are pre-loaded)
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # Remove runAsNonRoot (dev images may run as root)
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/template/spec/securityContext/runAsNonRoot
        value: false

  # OpenCode MCP URL points to dev namespace
  - target:
      kind: ConfigMap
      name: opencode-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: opencode-config
      data:
        .opencode.json: |
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "google-vertex-anthropic/claude-opus-4-6@default",
            "mcp": {
              "amortized": {
                "type": "remote",
                "url": "http://amortized-server.amortized-dev.svc.cluster.local:8000/mcp",
                "enabled": true
              }
            },
            "agent": {
              "build": { "disable": true },
              "plan": { "disable": true }
            }
          }

  # Claude Code MCP URL points to dev namespace
  - target:
      kind: Deployment
      name: claude-code
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: claude-code
      spec:
        template:
          spec:
            containers:
              - name: claude-code
                env:
                  - name: MCP_AMORTIZED_URL
                    value: "http://amortized-server.amortized-dev.svc.cluster.local:8000/mcp"

  # Studio MLFLOW_HOST uses cross-namespace DNS (MLflow runs in amortized)
  - target:
      kind: Deployment
      name: amortized-studio
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: amortized-studio
      spec:
        template:
          spec:
            containers:
              - name: studio
                env:
                  - name: MLFLOW_HOST
                    value: "mlflow.amortized"
