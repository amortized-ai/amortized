# Reuses the cluster-shared MinIO in the `amortized` namespace (cross-ns FQDN).
# With enterprise MLflow serveArtifacts=true, clients do not strictly need S3
# creds for artifact I/O, but these cover any direct-S3 code path.
apiVersion: v1
kind: Secret
metadata:
  name: amortized-s3
  labels:
    app: amortized
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
  AWS_S3_ENDPOINT: "http://minio.amortized.svc.cluster.local:9000"
  MLFLOW_S3_ENDPOINT_URL: "http://minio.amortized.svc.cluster.local:9000"
  FSSPEC_S3_ENDPOINT_URL: "http://minio.amortized.svc.cluster.local:9000"
  FSSPEC_S3_KEY: "minioadmin"
  FSSPEC_S3_SECRET: "minioadmin"
