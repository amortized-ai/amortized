apiVersion: v1
kind: Service
metadata:
  name: amortized-studio-nodeport
  namespace: amortized-esivaram
  labels:
    app: amortized
    component: studio
spec:
  type: NodePort
  selector:
    app: amortized
    component: studio
  ports:
    - port: 8080
      targetPort: http
      nodePort: 31140
---
apiVersion: v1
kind: Service
metadata:
  name: amortized-server-nodeport
  namespace: amortized-esivaram
  labels:
    app: amortized
    component: server
spec:
  type: NodePort
  selector:
    app: amortized
    component: server
  ports:
    - port: 8000
      targetPort: http
      nodePort: 31141
