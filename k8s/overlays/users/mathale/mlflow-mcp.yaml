apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-mcp
  namespace: amortized-mathale
  labels:
    app: amortized
    component: mlflow-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortized
      component: mlflow-mcp
  template:
    metadata:
      labels:
        app: amortized
        component: mlflow-mcp
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mlflow-mcp
          image: ghcr.io/us-all/mlflow-mcp-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: mcp
              containerPort: 3000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.amortized.svc.cluster.local:5000"
            - name: MCP_TRANSPORT
              value: "http"
            - name: MCP_HTTP_HOST
              value: "0.0.0.0"
            - name: MCP_HTTP_PORT
              value: "3000"
            - name: MCP_HTTP_SKIP_AUTH
              value: "true"
            - name: MLFLOW_TOOLS
              value: "experiments,runs,registry"
            - name: MLFLOW_ALLOW_WRITE
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-mcp
  namespace: amortized-mathale
  labels:
    app: amortized
    component: mlflow-mcp
spec:
  type: ClusterIP
  selector:
    app: amortized
    component: mlflow-mcp
  ports:
    - name: mcp
      port: 3000
      targetPort: mcp
