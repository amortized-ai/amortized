apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../dev
  - nodeport-services.yaml
  - gpu-quota.yaml

patches:
  # Add IMAGE_PULL_POLICY to amortized-config for the server to use
  - target:
      kind: ConfigMap
      name: amortized-config
    patch: |
      - op: add
        path: /data/AMORTIZED_IMAGE_PULL_POLICY
        value: "IfNotPresent"
