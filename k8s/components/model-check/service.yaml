apiVersion: v1
kind: Service
metadata:
  name: amortized-model-check
  namespace: amortized
  labels:
    app: amortized
    component: model-check
  annotations:
    # OpenShift's service CA issues the serving cert into this Secret.
    service.beta.openshift.io/serving-cert-secret-name: amortized-model-check-tls
spec:
  type: ClusterIP
  selector:
    app: amortized
    component: model-check
  ports:
    - name: https
      port: 7351
      targetPort: https
